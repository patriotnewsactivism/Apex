name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  ARTIFACT_REPO: cloud-run-source-deploy
  GCP_SA_KEY: ${{ secrets.APEX_GCP_SA_KEY || secrets.GCP_SA_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate APEX deployment credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCP_SA_KEY:-}" ]]; then
            echo "Missing APEX_GCP_SA_KEY (preferred) or GCP_SA_KEY." >&2
            exit 2
          fi
          actual="$(printf '%s' "$GCP_SA_KEY" | jq -r '.client_email // empty')"
          if [[ "$actual" != "$EXPECTED_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "Wrong APEX Google credential. Expected $EXPECTED_DEPLOY_SERVICE_ACCOUNT but secret contains ${actual:-unknown}." >&2
            exit 3
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/${{ secrets.APEX_CLOUD_RUN_SERVICE }}:$GITHUB_SHA"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          # The browser dashboard must be reachable without a Google IAM token.
          # APEX still protects privileged /api/* routes with its own admin
          # bearer-token middleware, so public Cloud Run ingress does not make
          # the control plane anonymous.
          gcloud run deploy ${{ secrets.APEX_CLOUD_RUN_SERVICE }} \
            --project "$GCP_PROJECT_ID" \
            --region ${{ secrets.APEX_CLOUD_RUN_REGION }} \
            --image "$IMAGE" \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployment and auth boundary
        run: |
          set -euo pipefail
          sleep 10
          SERVICE_URL=$(gcloud run services describe ${{ secrets.APEX_CLOUD_RUN_SERVICE }} \
            --project "$GCP_PROJECT_ID" \
            --region ${{ secrets.APEX_CLOUD_RUN_REGION }} \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"

          # Public shell and public health must work without Google IAM auth.
          curl -fsS "$SERVICE_URL/" -o /tmp/apex-root.html
          if grep -qi 'Bearer token required' /tmp/apex-root.html; then
            echo 'Dashboard is still blocked by Google IAM.' >&2
            exit 1
          fi
          curl -fsS "$SERVICE_URL/health" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'Health: {d.get(\"status\",\"?\")}  SHA: {d.get(\"build\",{}).get(\"sha\",\"?\")}  Agents: {d.get(\"agents\",\"?\")}')"

          # The application control plane must still reject anonymous API calls.
          API_STATUS=$(curl -sS -o /tmp/apex-api.json -w '%{http_code}' "$SERVICE_URL/api/tasks")
          if [ "$API_STATUS" != "401" ]; then
            echo "Expected anonymous /api/tasks to return 401, got $API_STATUS" >&2
            cat /tmp/apex-api.json >&2 || true
            exit 1
          fi

          # Verify the actual custom domain that users open in the browser.
          curl -fsS "https://apex.donmatthews.live/" -o /tmp/apex-custom-root.html
          if grep -qi 'Bearer token required' /tmp/apex-custom-root.html; then
            echo 'Custom domain is still blocked by Google IAM.' >&2
            exit 1
          fi
