name: Productionize OpenRouter Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/productionize-openrouter-once.yml

permissions:
  contents: write

jobs:
  productionize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Apply permanent production posture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')

          # OpenRouter's live model catalog exposes the moving alias with the
          # leading ~. Keep every runtime/config/test reference aligned.
          targets = [
              repo / 'packages/core/src/llm-client.ts',
              repo / 'scripts/verify-provider-routing.ts',
              repo / 'packages/convex-backend/convex/llm.ts',
              repo / 'packages/convex-backend/convex/llmConfig.ts',
              *sorted((repo / 'packages/agents/src').glob('*.ts')),
          ]
          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text()
              text = re.sub(r'(?<!~)deepseek/deepseek-v4-flash-latest', '~deepseek/deepseek-v4-flash-latest', text)
              # Canonical key first; optional second key is credential redundancy.
              text = text.replace("apiKeyEnvs: ['OPENROUTER_API_KEY_2', 'OPENROUTER_API_KEY']", "apiKeyEnvs: ['OPENROUTER_API_KEY', 'OPENROUTER_API_KEY_2']")
              path.write_text(text)

          # The demo incident used one global LLM slot effectively. Production
          # gets six smoothed process-wide slots; provider pacing/cooldowns and
          # token reservations still prevent retry storms/oversubscription.
          core = repo / 'packages/core/src/llm-client.ts'
          text = core.read_text()
          old = """const configuredLLMConcurrency = Number(process.env.APEX_MAX_CONCURRENT_LLM_CALLS ?? 3);\nconst MAX_CONCURRENT_LLM_CALLS = Number.isFinite(configuredLLMConcurrency)\n  ? Math.min(16, Math.max(1, Math.floor(configuredLLMConcurrency)))\n  : 3;"""
          new = """const configuredLLMConcurrency = Number(process.env.APEX_MAX_CONCURRENT_LLM_CALLS ?? 6);\nconst MAX_CONCURRENT_LLM_CALLS = Number.isFinite(configuredLLMConcurrency)\n  ? Math.min(16, Math.max(1, Math.floor(configuredLLMConcurrency)))\n  : 6;"""
          if old not in text:
              raise SystemExit('Expected LLM concurrency block not found')
          core.write_text(text.replace(old, new, 1))

          # Restore useful lead-research parallelism, but keep it bounded and
          # environment-tunable. The scheduler dedupe hotfix remains in place.
          agents_index = repo / 'packages/agents/src/index.ts'
          text = agents_index.read_text()
          old = """  for (const AgentClass of agentClasses) {\n    const agent = new (AgentClass as new (overrides?: Record<string, unknown>) => BaseAgent)(\n      options.approvalRequired !== undefined ? { approvalRequired: options.approvalRequired } : {},\n    );\n    workforce.set(agent.id, agent);\n  }"""
          new = """  for (const AgentClass of agentClasses) {\n    const overrides: Record<string, unknown> =\n      options.approvalRequired !== undefined ? { approvalRequired: options.approvalRequired } : {};\n\n    if (AgentClass === LeadResearchAgent) {\n      const configured = Number(process.env.APEX_LEAD_RESEARCH_CONCURRENCY ?? 3);\n      overrides.concurrency = Number.isFinite(configured)\n        ? Math.min(5, Math.max(1, Math.floor(configured)))\n        : 3;\n    }\n\n    const agent = new (AgentClass as new (overrides?: Record<string, unknown>) => BaseAgent)(overrides);\n    workforce.set(agent.id, agent);\n  }"""
          if old not in text:
              raise SystemExit('Expected workforce construction block not found')
          agents_index.write_text(text.replace(old, new, 1))

          # The old loader was still migrating Groq credentials and imposing a
          # 1,048,576-token cap on OpenRouter. In production, load persisted
          # settings but strip only migration-generated legacy caps in memory.
          (repo / 'packages/api-server/src/settingsLoader.ts').write_text("""/**\n * Settings Loader — applies DB-persisted integration settings into process.env\n * before agents start. Values are never logged.\n */\n\nimport { db, integrationSettings } from '@workspace/db';\n\nfunction stripLegacyFreeTierCaps(raw: string | undefined): string {\n  const entries = new Map<string, string>();\n  for (const part of (raw ?? '').split(',')) {\n    const [name, value] = part.split(':').map((piece) => piece?.trim());\n    if (name && value) entries.set(name, value);\n  }\n\n  for (const legacy of ['groq', 'google-gemini', 'cohere', 'poolside', 'qwen', 'kilo', 'mistral']) {\n    entries.delete(legacy);\n  }\n\n  // This exact cap was injected by the temporary OpenRouter migration. Remove\n  // it so production is not artificially parked after ~1M tokens/day. A\n  // deliberately configured different OpenRouter cap is preserved.\n  if (entries.get('openrouter-deepseek-flash') === '1048576') {\n    entries.delete('openrouter-deepseek-flash');\n  }\n\n  return [...entries.entries()].map(([name, value]) => `${name}:${value}`).join(',');\n}\n\nexport async function loadSettingsIntoEnv(): Promise<void> {\n  try {\n    const rows = await db.select().from(integrationSettings);\n    let applied = 0;\n    for (const row of rows) {\n      if (row.value) {\n        process.env[row.key] = row.value;\n        applied++;\n      }\n    }\n\n    const currentCaps = process.env.APEX_TOKEN_CAPS ?? '';\n    const normalizedCaps = stripLegacyFreeTierCaps(currentCaps);\n    if (normalizedCaps !== currentCaps) {\n      process.env.APEX_TOKEN_CAPS = normalizedCaps;\n      console.log('[settings] Ignored legacy free-tier token caps for the OpenRouter production runtime.');\n    }\n\n    if (applied > 0) {\n      console.log(`[settings] Applied ${applied} DB-persisted integration setting(s) into process.env at boot.`);\n    }\n  } catch (err) {\n    console.warn(\n      '[settings] Failed to load integration settings from DB (continuing with platform env vars only):',\n      err instanceof Error ? err.message : err,\n    );\n  }\n}\n""")

          # Replace the obsolete seven-provider UI catalog with the actual
          # production OpenRouter control surface while preserving every other
          # non-LLM integration definition below it.
          settings = repo / 'packages/api-server/src/routes/settings.ts'
          text = settings.read_text()
          replacement = """const BASE_INTEGRATION_CATALOG: IntegrationDefinition[] = [\n  {\n    id: 'openrouter',\n    name: 'OpenRouter — Production LLM',\n    description: 'Primary APEX inference layer. Routes DeepSeek V4 Flash/Pro through OpenRouter with provider failover, pacing, and circuit breakers.',\n    category: 'ai',\n    docsUrl: 'https://openrouter.ai',\n    envVars: [\n      {\n        key: 'OPENROUTER_API_KEY', label: 'Primary API Key', placeholder: 'sk-or-v1-...', secret: true,\n        probe: { kind: 'openai-models', baseUrl: 'https://openrouter.ai/api/v1' },\n      },\n      {\n        key: 'OPENROUTER_API_KEY_2', label: 'Secondary API Key', placeholder: 'sk-or-v1-...', secret: true,\n        probe: { kind: 'openai-models', baseUrl: 'https://openrouter.ai/api/v1' },\n      },\n      { key: 'APEX_MAX_CONCURRENT_LLM_CALLS', label: 'Global LLM Concurrency', placeholder: '6' },\n      { key: 'APEX_LEAD_RESEARCH_CONCURRENCY', label: 'Lead Research Concurrency', placeholder: '3' },\n      { key: 'APEX_TOKEN_CAP_TOTAL', label: 'Optional Daily Token Cap', placeholder: '0 = unlimited' },\n      { key: 'APEX_TOKEN_CAPS', label: 'Optional Per-Model Token Caps', placeholder: 'provider:tokens,...' },\n    ],\n  },\n"""
          pattern = re.compile(r"const BASE_INTEGRATION_CATALOG: IntegrationDefinition\[\] = \[\n.*?(?=  \{\n    id: 'business-search')", re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one AI catalog block, replaced {count}')
          settings.write_text(text)

          # Current production example: OpenRouter only, moderate parallelism,
          # no inherited free-tier hard cap. Other integration placeholders are
          # retained without real credentials.
          (repo / '.env.example').write_text("""# ─── APEX Production Intelligence Stack ─────────────────────────────────────\n# packages/core/src/llm-client.ts is the source of truth.\n# All APEX units route through OpenRouter.\n#\n# Standard workers: DeepSeek V4 Flash Latest -> Flash 0731 -> Pro 0813 fallback.\n# OpenRouter performs upstream provider routing/failover behind each model.\n\nOPENROUTER_API_KEY=\n# Optional credential redundancy. This may be a second key; account-level\n# balance/rate limits still apply when both keys belong to the same account.\nOPENROUTER_API_KEY_2=\n\n# ─── Agent Behavior ──────────────────────────────────────────────────────────\n# strict = gate every agent; normal = role/tool policy (recommended).\nAPEX_APPROVAL_MODE=normal\n\n# ─── Production Resource Governor ────────────────────────────────────────────\n# 0 = no APEX-wide daily token ceiling. Set a positive value when you want a\n# deliberate workspace spend ceiling; OpenRouter account controls remain the\n# authoritative billing limit.\nAPEX_TOKEN_CAP_TOTAL=0\n# Optional comma-separated caps, e.g. provider:tokens. Leave unset for normal\n# paid production operation.\n# APEX_TOKEN_CAPS=openrouter-deepseek-pro:5000000\nAPEX_TOKEN_PACING_ENABLED=true\nAPEX_TOKEN_PACING_BURST_TOKENS=50000\n\n# Six process-wide inference slots across the 13-agent workforce. Lead research\n# may use at most three by default; all requests still respect provider pacing,\n# circuit breakers, retry-after, and token reservations.\nAPEX_MAX_CONCURRENT_LLM_CALLS=6\nAPEX_LEAD_RESEARCH_CONCURRENCY=3\nAPEX_MAX_OUTPUT_TOKENS=4096\n# APEX_MAX_OUTPUT_TOKENS_CEO=8192\n# APEX_MAX_OUTPUT_TOKENS_CTO=8192\n\nAPEX_SELF_REVIEW=adaptive\n\n# Experimental only. Keep false while the primary production database/runtime\n# remains outside the unfinished Convex migration.\nAPEX_CONVEX_AUTONOMY_ENABLED=false\n\n# ─── Workspace / Database ────────────────────────────────────────────────────\n# WORKSPACE_ROOT=/path/to/workspace\nDATABASE_URL=postgres://USER:PASSWORD@HOST:5432/apex\nDB_LOGGING=false\n\n# ─── BuildMyBot Connector (optional) ─────────────────────────────────────────\n# BUILDMYBOT_SUPABASE_URL=\n# BUILDMYBOT_SUPABASE_SERVICE_KEY=\n# BUILDMYBOT_APP_URL=https://www.buildmybot.app\n# BUILDMYBOT_CRON_SECRET=\n# BUILDMYBOT_VERCEL_DEPLOY_HOOK=\n\n# ─── CaseBuddy Connector (optional) ──────────────────────────────────────────\n# CASEBUDDY_SUPABASE_URL=\n# CASEBUDDY_SUPABASE_SERVICE_KEY=\n# CASEBUDDY_APP_URL=https://casebuddy.live\n# CASEBUDDY_SYSTEM_USER_ID=\n\n# ─── TubeScribe Connector (optional, read-only monitoring) ───────────────────\n# TUBESCRIBE_SUPABASE_URL=\n# TUBESCRIBE_SUPABASE_SERVICE_KEY=\n# TUBESCRIBE_WORKER_URL=\n\n# ─── Business Search APIs ────────────────────────────────────────────────────\n# YELP_API_KEY=\n# GOOGLE_PLACES_API_KEY=\n# TAVILY_API_KEY=\n# BRAVE_SEARCH_API_KEY=\n\n# ─── GitHub / Business Integrations ──────────────────────────────────────────\n# GITHUB_TOKEN=\nSTRIPE_SECRET_KEY=\n# VAPI_API_KEY=\n# VAPI_PHONE_NUMBER_ID=\n# VAPI_WEBHOOK_SECRET=\n# VAPI_WEBHOOK_URL=\n\nPORT=5000\n""")

          # Clean misleading comments left from pre-production infrastructure.
          health = repo / 'packages/api-server/src/routes/health.ts'
          if health.exists():
              text = health.read_text()
              text = text.replace('dashboard, monitoring tools, Railway health checks', 'dashboard, monitoring tools, production health checks')
              text = re.sub(r"  // GET /api/health/providers — why each LLM provider in the fallback chain\n  // was passed over\. Added 2026-07-29: qwen-cloud was promoted to the top of\n  // the chain, reported `configured: ok`, and still never served a request —\n  // and the reason existed only in container stdout\. This makes the chain's\n  // real behavior inspectable from the API\.\n", "  // GET /api/health/providers — current OpenRouter model-route health,\n  // recent failures, and structured-tool-call degradation telemetry.\n", text)
              health.write_text(text)

          # Remove the ad-hoc deploy workflow that is not trusted by the AWS OIDC
          # role. Production releases use .github/workflows/deploy.yml only.
          (repo / '.github/workflows/hotfix-deploy-now.yml').unlink(missing_ok=True)

          # This workflow is intentionally one-shot.
          (repo / '.github/workflows/productionize-openrouter-once.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production runtime
        run: |
          pnpm run typecheck:production
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-routing.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-backpressure.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-budget-pause.ts"
          pnpm --filter @workspace/cicd-automation exec tsx "$GITHUB_WORKSPACE/scripts/verify-deploy-provenance.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-malformed-tool-calls.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-non-completion.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-branch-review-guards.ts"
          pnpm --filter @workspace/dashboard build

      - name: Commit production posture
        run: |
          git config user.name "APEX Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "prod: finalize OpenRouter runtime and restore workforce throughput"
          git push origin HEAD:main
