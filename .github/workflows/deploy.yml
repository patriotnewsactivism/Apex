# Manual, audited AWS Lightsail release. Pushing main does not deploy by itself.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY for production
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guard production release
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          test "$DEPLOY_REF" = "refs/heads/main"
          test "$DEPLOY_CONFIRM" = "DEPLOY"

      - name: Build, deploy, and verify Lightsail
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
          APEX_CODEBUILD_PROJECT: ${{ vars.APEX_CODEBUILD_PROJECT || 'apex-lightsail-build' }}
          APEX_LIGHTSAIL_SERVICE: ${{ vars.APEX_LIGHTSAIL_SERVICE || 'apex-service' }}
        run: >-
          pnpm exec tsx packages/cicd-automation/scripts/deploy.mts
          production --expect-sha "${{ github.sha }}"
