name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/429262820734/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  ARTIFACT_REPO: cloud-run-source-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate APEX deployment with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          if [[ "$active" != "$EXPECTED_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "Wrong APEX Google identity. Expected $EXPECTED_DEPLOY_SERVICE_ACCOUNT but authenticated as ${active:-unknown}." >&2
            exit 3
          fi

      - name: Validate existing production Cloud Run target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="${{ secrets.APEX_CLOUD_RUN_SERVICE }}"
          REGION="${{ secrets.APEX_CLOUD_RUN_REGION }}"
          if [[ -z "$SERVICE" || -z "$REGION" ]]; then
            echo 'Missing APEX_CLOUD_RUN_SERVICE or APEX_CLOUD_RUN_REGION.' >&2
            exit 2
          fi
          if ! gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format=json >/tmp/apex-service.json 2>/tmp/apex-service.err; then
            cat /tmp/apex-service.err >&2 || true
            echo 'Configured APEX Cloud Run service does not exist or is inaccessible. Refusing to create a replacement service.' >&2
            exit 4
          fi
          READY="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          CREATED="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          URL="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          if [[ -z "$READY" && -z "$CREATED" ]]; then
            echo "Configured target $SERVICE has neither a Ready nor a created revision. Refusing recovery because this is not an established Cloud Run service." >&2
            exit 5
          fi
          echo "Target service: $SERVICE"
          echo "Current ready revision: ${READY:-none — recovery rollout required}"
          echo "Latest created revision: ${CREATED:-none}"
          echo "Current service URL: $URL"

          python3 - <<'PY'
          import json
          import os

          service = json.load(open('/tmp/apex-service.json'))
          containers = service.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [])
          env = {item.get('name'): item for item in (containers[0].get('env', []) if containers else [])}
          required = ('DATABASE_URL', 'APEX_ADMIN_TOKEN', 'APEX_ADMIN_PASSWORD')
          github_database_url = bool(os.environ.get('DATABASE_URL'))
          missing = [
              name for name in required
              if name not in env and not (name == 'DATABASE_URL' and github_database_url)
          ]
          for name in required:
              item = env.get(name)
              if name == 'DATABASE_URL' and not item and github_database_url:
                  print('DATABASE_URL: available from masked GitHub production secret')
              elif not item:
                  print(f'{name}: missing')
              elif item.get('valueFrom'):
                  print(f'{name}: configured from Secret Manager')
              else:
                  print(f'{name}: configured as a service environment value')
          if missing:
              raise SystemExit('Missing required APEX runtime configuration: ' + ', '.join(missing))
          PY

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/${{ secrets.APEX_CLOUD_RUN_SERVICE }}:$GITHUB_SHA"
          docker build \
            --platform linux/amd64 \
            --build-arg APEX_BUILD_SHA="$GITHUB_SHA" \
            --build-arg APEX_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update existing Cloud Run service image
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --project "$GCP_PROJECT_ID"
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}"
            --image "$IMAGE"
          )
          if [[ -n "${DATABASE_URL:-}" ]]; then
            args+=(--update-env-vars "^__APEX_DB__^DATABASE_URL=$DATABASE_URL")
            echo 'Attaching DATABASE_URL from masked GitHub production secret.'
          fi
          gcloud run services update "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" "${args[@]}" --quiet

      - name: Verify deployment and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          SERVICE_URL=$(gcloud run services describe "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
            --project "$GCP_PROJECT_ID" \
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"

          curl -fsS "$SERVICE_URL/" -o /tmp/apex-root.html
          if grep -qi 'Bearer token required' /tmp/apex-root.html; then
            echo 'Dashboard is still blocked by Google IAM.' >&2
            exit 1
          fi

          curl -fsS "$SERVICE_URL/health" -o /tmp/apex-health.json
          python3 - <<'PY'
          import json, os, sys
          d=json.load(open('/tmp/apex-health.json'))
          sha=d.get('build',{}).get('sha')
          print(f"Health: {d.get('status','?')}  SHA: {sha or '?'}  Agents: {d.get('agents','?')}")
          expected=os.environ.get('GITHUB_SHA')
          if sha != expected:
              print(f"Expected deployed SHA {expected}, got {sha}", file=sys.stderr)
              raise SystemExit(1)
          PY

          API_STATUS=$(curl -sS -o /tmp/apex-api.json -w '%{http_code}' "$SERVICE_URL/api/tasks")
          if [ "$API_STATUS" != "401" ]; then
            echo "Expected anonymous /api/tasks to return 401, got $API_STATUS" >&2
            cat /tmp/apex-api.json >&2 || true
            exit 1
          fi

          curl -fsS "https://apex.donmatthews.live/" -o /tmp/apex-custom-root.html
          if grep -qi 'Bearer token required' /tmp/apex-custom-root.html; then
            echo 'Custom domain is still blocked by Google IAM.' >&2
            exit 1
          fi
