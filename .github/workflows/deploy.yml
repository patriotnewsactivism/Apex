name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write

# Only one production deployment may run at a time. If a newer green main
# commit arrives, its run supersedes an older deployment that has not finished.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/429262820734/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  ARTIFACT_REPO: cloud-run-source-deploy
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify candidate is the current main SHA and deployment is explicitly enabled
        id: current
        env:
          DEPLOY_ENABLED_VAR: ${{ vars.APEX_DEPLOY_ENABLED }}
          DEPLOY_ENABLED_SECRET: ${{ secrets.APEX_DEPLOY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "Skipping stale deploy candidate $DEPLOY_SHA; current main is $current_main."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_enabled="${DEPLOY_ENABLED_VAR:-${DEPLOY_ENABLED_SECRET:-}}"
          case "${deploy_enabled,,}" in
            production|all)
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Production deployment is not explicitly enabled. Set APEX_DEPLOY_ENABLED=production (or all) as a repository variable/secret.'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate APEX deployment with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          if [[ "$active" != "$EXPECTED_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "Wrong APEX Google identity. Expected $EXPECTED_DEPLOY_SERVICE_ACCOUNT but authenticated as ${active:-unknown}." >&2
            exit 3
          fi

      - name: Resolve the APEX database credential
        id: db
        env:
          GITHUB_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # APEX durable state lives in the existing production Postgres. Never
          # create a replacement database merely to make deployment succeed.
          if [[ -n "${GITHUB_DATABASE_URL:-}" ]]; then
            echo 'source=github' >> "$GITHUB_OUTPUT"
            echo 'Resolved DATABASE_URL from the masked GitHub production secret.'
            exit 0
          fi

          for candidate in \
            apex-database-url \
            apex-db-url \
            apex-supabase-database-url \
            apex-postgres-url \
            database-url \
            DATABASE_URL; do
            if gcloud secrets describe "$candidate" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo 'source=secret-manager' >> "$GITHUB_OUTPUT"
              echo "secret_name=$candidate" >> "$GITHUB_OUTPUT"
              echo "Resolved DATABASE_URL from Secret Manager secret '$candidate'."
              exit 0
            fi
          done

          echo 'source=none' >> "$GITHUB_OUTPUT"
          echo 'No DATABASE_URL found. Secrets that DO exist in this project:'
          gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null \
            | sed 's/^/  - /' || echo '  (unable to list secrets)'

          {
            echo '### APEX database credential missing'
            echo
            echo 'The existing production database connection string could not be resolved.'
            echo 'Do not provision a replacement database. Restore the existing DSN in Secret Manager or the GitHub production secret, then allow CI to produce a new eligible deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve optional AI and lead-research credentials
        id: lead_secrets
        env:
          GITHUB_OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          GITHUB_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GITHUB_GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GITHUB_YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          GITHUB_FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_optional() {
            local env_name="$1"
            local github_env_name="$2"
            shift 2
            local github_value="${!github_env_name:-}"

            if [[ -n "$github_value" ]]; then
              echo "${env_name}_SOURCE=github" >> "$GITHUB_OUTPUT"
              echo "$env_name: resolved from masked GitHub secret."
              return 0
            fi

            local candidate
            for candidate in "$@"; do
              if gcloud secrets describe "$candidate" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
                echo "${env_name}_SOURCE=secret-manager" >> "$GITHUB_OUTPUT"
                echo "${env_name}_SECRET_NAME=$candidate" >> "$GITHUB_OUTPUT"
                echo "$env_name: resolved from Secret Manager secret '$candidate'."
                return 0
              fi
            done

            echo "${env_name}_SOURCE=existing" >> "$GITHUB_OUTPUT"
            echo "$env_name: no GitHub/Secret Manager source found; preserving any existing Cloud Run binding."
          }

          resolve_optional OPENROUTER_API_KEY_2 GITHUB_OPENROUTER_API_KEY_2 \
            apex-openrouter-api-key-2 openrouter-api-key-2 OPENROUTER_API_KEY_2
          resolve_optional OPENROUTER_API_KEY GITHUB_OPENROUTER_API_KEY \
            apex-openrouter-api-key openrouter-api-key OPENROUTER_API_KEY
          resolve_optional TAVILY_API_KEY GITHUB_TAVILY_API_KEY \
            apex-tavily-api-key tavily-api-key TAVILY_API_KEY
          resolve_optional BRAVE_SEARCH_API_KEY GITHUB_BRAVE_SEARCH_API_KEY \
            apex-brave-search-api-key brave-search-api-key BRAVE_SEARCH_API_KEY
          resolve_optional GOOGLE_PLACES_API_KEY GITHUB_GOOGLE_PLACES_API_KEY \
            apex-google-places-api-key google-places-api-key GOOGLE_PLACES_API_KEY
          resolve_optional YELP_API_KEY GITHUB_YELP_API_KEY \
            apex-yelp-api-key yelp-api-key YELP_API_KEY
          resolve_optional FIRECRAWL_API_KEY GITHUB_FIRECRAWL_API_KEY \
            apex-firecrawl-api-key firecrawl-api-key FIRECRAWL_API_KEY

      - name: Validate existing production Cloud Run target
        env:
          DB_SOURCE: ${{ steps.db.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="${{ secrets.APEX_CLOUD_RUN_SERVICE }}"
          REGION="${{ secrets.APEX_CLOUD_RUN_REGION }}"
          if [[ -z "$SERVICE" || -z "$REGION" ]]; then
            echo 'Missing APEX_CLOUD_RUN_SERVICE or APEX_CLOUD_RUN_REGION.' >&2
            exit 2
          fi
          if ! gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format=json >/tmp/apex-service.json 2>/tmp/apex-service.err; then
            cat /tmp/apex-service.err >&2 || true
            echo 'Configured APEX Cloud Run service does not exist or is inaccessible. Refusing to create a replacement service.' >&2
            exit 4
          fi

          READY="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          CREATED="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          URL="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          if [[ -z "$READY" && -z "$CREATED" ]]; then
            echo "Configured target $SERVICE has neither a Ready nor a created revision. Refusing recovery because this is not an established Cloud Run service." >&2
            exit 5
          fi
          echo "Target service: $SERVICE"
          echo "Current ready revision: ${READY:-none — recovery rollout required}"
          echo "Latest created revision: ${CREATED:-none}"
          echo "Current service URL: $URL"

          python3 - <<'PY'
          import json
          import os

          service = json.load(open('/tmp/apex-service.json'))
          containers = service.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [])
          env = {item.get('name'): item for item in (containers[0].get('env', []) if containers else [])}
          required = ('DATABASE_URL', 'APEX_ADMIN_TOKEN', 'APEX_ADMIN_PASSWORD')
          db_source = os.environ.get('DB_SOURCE', 'none')
          resolved_externally = db_source in ('github', 'secret-manager')
          missing = [
              name for name in required
              if name not in env and not (name == 'DATABASE_URL' and resolved_externally)
          ]
          for name in required:
              item = env.get(name)
              if name == 'DATABASE_URL' and not item and resolved_externally:
                  print(f'DATABASE_URL: will be attached from {db_source}')
              elif not item:
                  print(f'{name}: missing')
              elif item.get('valueFrom'):
                  print(f'{name}: configured from Secret Manager')
              else:
                  print(f'{name}: configured as a service environment value')
          if missing:
              raise SystemExit('Missing required APEX runtime configuration: ' + ', '.join(missing))

          print('Lead-research runtime configuration currently on Cloud Run:')
          for name in (
              'OPENROUTER_API_KEY_2', 'OPENROUTER_API_KEY', 'TAVILY_API_KEY',
              'BRAVE_SEARCH_API_KEY', 'GOOGLE_PLACES_API_KEY', 'YELP_API_KEY',
              'FIRECRAWL_API_KEY',
          ):
              item = env.get(name)
              if not item:
                  print(f'{name}: not currently attached')
              elif item.get('valueFrom'):
                  print(f'{name}: configured from Secret Manager')
              else:
                  print(f'{name}: configured as a service environment value')
          PY

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push immutable image from verified CI SHA
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/${{ secrets.APEX_CLOUD_RUN_SERVICE }}:$DEPLOY_SHA"
          docker build \
            --platform linux/amd64 \
            --build-arg APEX_BUILD_SHA="$DEPLOY_SHA" \
            --build-arg APEX_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Re-verify current main before production mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "Deployment candidate became stale before Cloud Run update: candidate=$DEPLOY_SHA current-main=$current_main" >&2
            exit 7
          fi

      - name: Update existing Cloud Run service image and runtime credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SOURCE: ${{ steps.db.outputs.source }}
          DB_SECRET_NAME: ${{ steps.db.outputs.secret_name }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY_2_SOURCE: ${{ steps.lead_secrets.outputs.OPENROUTER_API_KEY_2_SOURCE }}
          OPENROUTER_API_KEY_2_SECRET_NAME: ${{ steps.lead_secrets.outputs.OPENROUTER_API_KEY_2_SECRET_NAME }}
          OPENROUTER_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.OPENROUTER_API_KEY_SOURCE }}
          OPENROUTER_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.OPENROUTER_API_KEY_SECRET_NAME }}
          TAVILY_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.TAVILY_API_KEY_SOURCE }}
          TAVILY_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.TAVILY_API_KEY_SECRET_NAME }}
          BRAVE_SEARCH_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.BRAVE_SEARCH_API_KEY_SOURCE }}
          BRAVE_SEARCH_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.BRAVE_SEARCH_API_KEY_SECRET_NAME }}
          GOOGLE_PLACES_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.GOOGLE_PLACES_API_KEY_SOURCE }}
          GOOGLE_PLACES_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.GOOGLE_PLACES_API_KEY_SECRET_NAME }}
          YELP_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.YELP_API_KEY_SOURCE }}
          YELP_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.YELP_API_KEY_SECRET_NAME }}
          FIRECRAWL_API_KEY_SOURCE: ${{ steps.lead_secrets.outputs.FIRECRAWL_API_KEY_SOURCE }}
          FIRECRAWL_API_KEY_SECRET_NAME: ${{ steps.lead_secrets.outputs.FIRECRAWL_API_KEY_SECRET_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --project "$GCP_PROJECT_ID"
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}"
            --image "$IMAGE"

            # APEX is a singleton autonomous workforce, not a stateless web
            # service. Every container start boots all 13 agents and their
            # polling loops, so more than one instance means several copies of
            # each agent racing for the same rows.
            --max-instances=1

            # Without a warm instance Cloud Run scales to zero and the autonomous
            # loops simply stop between requests; with CPU throttling they stall
            # the moment no HTTP request is in flight. A background workforce
            # needs both of these to keep working when nobody is watching.
            --min-instances=1
            --no-cpu-throttling
          )

          delim='__APEX_ENV_94B4F__'
          env_spec="^${delim}^"
          has_env=false
          secret_spec=''

          add_env() {
            local name="$1"
            local value="$2"
            [[ -n "$value" ]] || return 0
            if [[ "$has_env" == true ]]; then env_spec+="$delim"; fi
            env_spec+="${name}=${value}"
            has_env=true
          }

          add_secret() {
            local name="$1"
            local secret_name="$2"
            [[ -n "$secret_name" ]] || return 0
            if [[ -n "$secret_spec" ]]; then secret_spec+=','; fi
            secret_spec+="${name}=${secret_name}:latest"
          }

          case "${DB_SOURCE:-none}" in
            secret-manager)
              add_secret DATABASE_URL "$DB_SECRET_NAME"
              echo "Attaching DATABASE_URL from Secret Manager secret '$DB_SECRET_NAME'."
              ;;
            github)
              add_env DATABASE_URL "$DATABASE_URL"
              echo 'Attaching DATABASE_URL from masked GitHub production secret.'
              # DATABASE_URL may already be bound on the live service as a
              # Secret Manager reference from an earlier deploy. gcloud refuses
              # to flip an existing binding from secret-type to a literal env
              # var in the same --update-env-vars call ("already been set with
              # a different type"), so drop any existing secret binding for
              # this exact name first, in its own call, before the real
              # update below applies the new literal value.
              echo 'Dropping any pre-existing DATABASE_URL Secret Manager binding so it can be re-bound as a literal env var...'
              gcloud run services update "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
                --project "$GCP_PROJECT_ID" \
                --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
                --remove-secrets=DATABASE_URL \
                --quiet 2>&1 | tee /tmp/remove-secret.log || true
              if grep -qi 'error' /tmp/remove-secret.log && ! grep -qi 'no changes\|not found\|does not exist' /tmp/remove-secret.log; then
                echo 'Unexpected error while removing existing DATABASE_URL secret binding — see log above.' >&2
              fi
              ;;
            *)
              echo 'No DATABASE_URL to attach; leaving existing service configuration untouched.'
              ;;
          esac

          attach_optional() {
            local name="$1"
            local source="$2"
            local secret_name="$3"
            local github_value="$4"
            case "$source" in
              github)
                add_env "$name" "$github_value"
                echo "$name: attaching masked GitHub secret."
                ;;
              secret-manager)
                add_secret "$name" "$secret_name"
                echo "$name: attaching Secret Manager secret '$secret_name'."
                ;;
              *)
                echo "$name: preserving existing Cloud Run configuration."
                ;;
            esac
          }

          attach_optional OPENROUTER_API_KEY_2 "$OPENROUTER_API_KEY_2_SOURCE" "$OPENROUTER_API_KEY_2_SECRET_NAME" "$OPENROUTER_API_KEY_2"
          attach_optional OPENROUTER_API_KEY "$OPENROUTER_API_KEY_SOURCE" "$OPENROUTER_API_KEY_SECRET_NAME" "$OPENROUTER_API_KEY"
          attach_optional TAVILY_API_KEY "$TAVILY_API_KEY_SOURCE" "$TAVILY_API_KEY_SECRET_NAME" "$TAVILY_API_KEY"
          attach_optional BRAVE_SEARCH_API_KEY "$BRAVE_SEARCH_API_KEY_SOURCE" "$BRAVE_SEARCH_API_KEY_SECRET_NAME" "$BRAVE_SEARCH_API_KEY"
          attach_optional GOOGLE_PLACES_API_KEY "$GOOGLE_PLACES_API_KEY_SOURCE" "$GOOGLE_PLACES_API_KEY_SECRET_NAME" "$GOOGLE_PLACES_API_KEY"
          attach_optional YELP_API_KEY "$YELP_API_KEY_SOURCE" "$YELP_API_KEY_SECRET_NAME" "$YELP_API_KEY"
          attach_optional FIRECRAWL_API_KEY "$FIRECRAWL_API_KEY_SOURCE" "$FIRECRAWL_API_KEY_SECRET_NAME" "$FIRECRAWL_API_KEY"

          if [[ "$has_env" == true ]]; then
            args+=(--update-env-vars "$env_spec")
          fi
          if [[ -n "$secret_spec" ]]; then
            args+=(--update-secrets "$secret_spec")
          fi

          gcloud run services update "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" "${args[@]}" --quiet

      - name: Verify deployment and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          SERVICE_URL=$(gcloud run services describe "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
            --project "$GCP_PROJECT_ID" \
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
            --format='value(status.url)')
          echo "Service URL: ${SERVICE_URL:-<none>}"

          if [[ -z "$SERVICE_URL" ]]; then
            echo 'Cloud Run reports no service URL, so the new revision never became Ready.' >&2
            echo 'Recent revision failures:' >&2
            gcloud run revisions list \
              --project "$GCP_PROJECT_ID" \
              --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
              --service "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
              --format='table(metadata.name, status.conditions[0].message)' \
              --limit 5 >&2 || true
            exit 6
          fi

          curl -fsS "$SERVICE_URL/" -o /tmp/apex-root.html
          if grep -qi 'Bearer token required' /tmp/apex-root.html; then
            echo 'Dashboard is still blocked by Google IAM.' >&2
            exit 1
          fi

          curl -fsS "$SERVICE_URL/health" -o /tmp/apex-health.json
          python3 - <<'PY'
          import json, os, sys
          d=json.load(open('/tmp/apex-health.json'))
          sha=d.get('build',{}).get('sha')
          print(f"Health: {d.get('status','?')}  SHA: {sha or '?'}  Agents: {d.get('agents','?')}")
          expected=os.environ.get('DEPLOY_SHA')
          if sha != expected:
              print(f"Expected deployed SHA {expected}, got {sha}", file=sys.stderr)
              raise SystemExit(1)
          PY

          API_STATUS=$(curl -sS -o /tmp/apex-api.json -w '%{http_code}' "$SERVICE_URL/api/tasks")
          if [ "$API_STATUS" != "401" ]; then
            echo "Expected anonymous /api/tasks to return 401, got $API_STATUS" >&2
            cat /tmp/apex-api.json >&2 || true
            exit 1
          fi

          curl -fsS "https://apex.donmatthews.live/" -o /tmp/apex-custom-root.html
          if grep -qi 'Bearer token required' /tmp/apex-custom-root.html; then
            echo 'Custom domain is still blocked by Google IAM.' >&2
            exit 1
          fi
