name: Cloud Run cleanup once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloud-run-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Purge retired AWS deployment residue
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/cicd-automation/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.dependencies) {
            delete pkg.dependencies['@aws-sdk/client-codebuild'];
            delete pkg.dependencies['@aws-sdk/client-lightsail'];
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm -f docs/aws-deploy-iam-policy.json
          rm -f docs/deploy-workflow.yml
          rm -f .github/workflows/cloud-run-cleanup-once.yml
          pnpm install --lockfile-only

      - name: Validate frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit cleaned Cloud Run-only tree
        shell: bash
        run: |
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: purge retired AWS deployment residue'
          git push origin HEAD:main
