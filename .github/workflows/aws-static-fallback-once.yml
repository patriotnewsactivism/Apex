name: AWS Static Fallback Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aws-static-fallback-once.yml

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Confirm existing AWS fallback credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'AWS_ACCESS_KEY_ID secret is not configured'; exit 2; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'AWS_SECRET_ACCESS_KEY secret is not configured'; exit 2; }
          echo 'Existing GitHub AWS credentials are available; values remain masked.'

      - name: Configure AWS credentials from existing GitHub secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build, deploy, and verify Lightsail
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
          APEX_CODEBUILD_PROJECT: ${{ vars.APEX_CODEBUILD_PROJECT || 'apex-lightsail-build' }}
          APEX_LIGHTSAIL_SERVICE: ${{ vars.APEX_LIGHTSAIL_SERVICE || 'apex-service' }}
          APEX_ADMIN_PASSWORD_OVERRIDE: ${{ vars.APEX_ADMIN_PASSWORD_OVERRIDE }}
        run: >-
          pnpm --filter @workspace/cicd-automation exec tsx
          "$GITHUB_WORKSPACE/packages/cicd-automation/scripts/deploy.mts"
          production --expect-sha "${{ github.sha }}"
