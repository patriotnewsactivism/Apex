name: Apply immutable Lightsail deploy fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/immutable-lightsail-image-tag' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply immutable image deploy patch
        run: python scripts/apply-immutable-lightsail-deploy.py

      - name: Keep workflow changes out of bot push
        run: git restore --source=HEAD -- .github/workflows

      - name: Verify patch shape
        run: |
          git diff --check
          git status --short

      - name: Commit source fix to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Lightsail with immutable image tags"
          git push origin "HEAD:$HEAD_REF"
