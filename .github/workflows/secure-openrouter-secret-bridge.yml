name: Secure OpenRouter Secret Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-openrouter-secret-bridge.yml'

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: apex-secure-openrouter-secret-bridge
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/429262820734/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  OPENROUTER_SECRET: apex-openrouter-api-key

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SERVICE: ${{ secrets.APEX_CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.APEX_CLOUD_RUN_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_SERVICE"
          test -n "$GCP_REGION"
          gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null

      - name: Open encrypted transfer bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          body="$(base64 -w0 /tmp/public.pem)"
          title="OpenRouter secret bridge public key ${GITHUB_RUN_ID}"
          jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}' >/tmp/issue.json
          number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input /tmp/issue.json --jq '.number')"
          echo "public_issue=$number" >> "$GITHUB_OUTPUT"

      - name: Receive and install encrypted credential
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ISSUE: ${{ steps.bridge.outputs.public_issue }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload_title="OpenRouter secret bridge payload ${GITHUB_RUN_ID}"
          payload_number=''
          payload_body=''
          for _ in $(seq 1 120); do
            record="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${payload_title}\") | [.number,.body] | @tsv" | head -n1 || true)"
            if [[ -n "$record" ]]; then
              payload_number="${record%%$'\t'*}"
              payload_body="${record#*$'\t'}"
              break
            fi
            sleep 5
          done
          [[ -n "$payload_body" ]] || { echo 'Encrypted payload not received.' >&2; exit 2; }

          printf '%s' "$payload_body" | base64 -d >/tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/payload.enc -out /tmp/openrouter.key \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256

          python3 - <<'PY'
          import os
          p='/tmp/openrouter.key'
          v=open(p,encoding='utf-8').read().strip()
          if not v.startswith('sk-or-') or len(v) < 40:
              raise SystemExit('Invalid OpenRouter credential payload')
          open(p,'w',encoding='utf-8').write(v)
          os.chmod(p,0o600)
          PY

          if ! gcloud secrets describe "$OPENROUTER_SECRET" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create "$OPENROUTER_SECRET" --project "$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
          fi
          gcloud secrets versions add "$OPENROUTER_SECRET" --project "$GCP_PROJECT_ID" --data-file=/tmp/openrouter.key >/dev/null
          gcloud secrets add-iam-policy-binding "$OPENROUTER_SECRET" --project "$GCP_PROJECT_ID" \
            --member "serviceAccount:${EXPECTED_DEPLOY_SERVICE_ACCOUNT}" --role roles/secretmanager.secretAccessor --quiet >/dev/null

          gcloud run services update "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --update-secrets OPENROUTER_API_KEY=${OPENROUTER_SECRET}:latest,OPENROUTER_API_KEY_2=${OPENROUTER_SECRET}:latest --quiet >/dev/null

          python3 - <<'PY'
          import json, urllib.request
          key=open('/tmp/openrouter.key',encoding='utf-8').read().strip()
          req=urllib.request.Request('https://openrouter.ai/api/v1/key',headers={'Authorization':f'Bearer {key}'})
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status != 200: raise SystemExit(f'OpenRouter verification returned HTTP {r.status}')
              data=json.load(r)
              if not isinstance(data,dict): raise SystemExit('Unexpected OpenRouter verification response')
          print('APEX OpenRouter credential verified and bound to Cloud Run.')
          PY

          rm -f /tmp/private.pem /tmp/public.pem /tmp/payload.enc /tmp/openrouter.key
          gh issue close "$payload_number" >/dev/null 2>&1 || true
          gh issue close "$PUBLIC_ISSUE" >/dev/null 2>&1 || true
