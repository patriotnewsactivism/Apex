# Portability baseline only. Do not deploy from this file until the operator
# explicitly authorizes Railway staging. Reuse the existing Dockerfile, /health,
# PORT contract, durable database, and existing secret names. Do not copy
# secrets into source control.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
