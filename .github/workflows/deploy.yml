name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  id-token: write

# Only one production deployment may run at a time. If a newer green main
# commit arrives, its run supersedes an older deployment that has not finished.
concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/429262820734/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  ARTIFACT_REPO: cloud-run-source-deploy
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  gate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.current.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify candidate is the current main SHA and deployment is explicitly enabled
        id: current
        env:
          DEPLOY_ENABLED_VAR: ${{ vars.APEX_DEPLOY_ENABLED }}
          DEPLOY_ENABLED_SECRET: ${{ secrets.APEX_DEPLOY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "Skipping stale deploy candidate $DEPLOY_SHA; current main is $current_main."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          deploy_enabled="${DEPLOY_ENABLED_VAR:-${DEPLOY_ENABLED_SECRET:-}}"
          case "${deploy_enabled,,}" in
            production|all)
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'Production deployment is not explicitly enabled. Set APEX_DEPLOY_ENABLED=production (or all) as a repository variable/secret.'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Authenticate APEX deployment with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployment identity
        shell: bash
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          if [[ "$active" != "$EXPECTED_DEPLOY_SERVICE_ACCOUNT" ]]; then
            echo "Wrong APEX Google identity. Expected $EXPECTED_DEPLOY_SERVICE_ACCOUNT but authenticated as ${active:-unknown}." >&2
            exit 3
          fi

      - name: Resolve the APEX database credential
        id: db
        env:
          GITHUB_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          # APEX durable state lives in the existing production Postgres. Never
          # create a replacement database merely to make deployment succeed.
          if [[ -n "${GITHUB_DATABASE_URL:-}" ]]; then
            echo 'source=github' >> "$GITHUB_OUTPUT"
            echo 'Resolved DATABASE_URL from the masked GitHub production secret.'
            exit 0
          fi

          for candidate in \
            apex-database-url \
            apex-db-url \
            apex-supabase-database-url \
            apex-postgres-url \
            database-url \
            DATABASE_URL; do
            if gcloud secrets describe "$candidate" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo 'source=secret-manager' >> "$GITHUB_OUTPUT"
              echo "secret_name=$candidate" >> "$GITHUB_OUTPUT"
              echo "Resolved DATABASE_URL from Secret Manager secret '$candidate'."
              exit 0
            fi
          done

          echo 'source=none' >> "$GITHUB_OUTPUT"
          echo 'No DATABASE_URL found. Secrets that DO exist in this project:'
          gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' 2>/dev/null \
            | sed 's/^/  - /' || echo '  (unable to list secrets)'

          {
            echo '### APEX database credential missing'
            echo
            echo 'The existing production database connection string could not be resolved.'
            echo 'Do not provision a replacement database. Restore the existing DSN in Secret Manager or the GitHub production secret, then allow CI to produce a new eligible deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate existing production Cloud Run target
        env:
          DB_SOURCE: ${{ steps.db.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="${{ secrets.APEX_CLOUD_RUN_SERVICE }}"
          REGION="${{ secrets.APEX_CLOUD_RUN_REGION }}"
          if [[ -z "$SERVICE" || -z "$REGION" ]]; then
            echo 'Missing APEX_CLOUD_RUN_SERVICE or APEX_CLOUD_RUN_REGION.' >&2
            exit 2
          fi
          if ! gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format=json >/tmp/apex-service.json 2>/tmp/apex-service.err; then
            cat /tmp/apex-service.err >&2 || true
            echo 'Configured APEX Cloud Run service does not exist or is inaccessible. Refusing to create a replacement service.' >&2
            exit 4
          fi

          READY="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          CREATED="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          URL="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"
          if [[ -z "$READY" && -z "$CREATED" ]]; then
            echo "Configured target $SERVICE has neither a Ready nor a created revision. Refusing recovery because this is not an established Cloud Run service." >&2
            exit 5
          fi
          echo "Target service: $SERVICE"
          echo "Current ready revision: ${READY:-none — recovery rollout required}"
          echo "Latest created revision: ${CREATED:-none}"
          echo "Current service URL: $URL"

          python3 - <<'PY'
          import json
          import os

          service = json.load(open('/tmp/apex-service.json'))
          containers = service.get('spec', {}).get('template', {}).get('spec', {}).get('containers', [])
          env = {item.get('name'): item for item in (containers[0].get('env', []) if containers else [])}
          required = ('DATABASE_URL', 'APEX_ADMIN_TOKEN', 'APEX_ADMIN_PASSWORD')
          db_source = os.environ.get('DB_SOURCE', 'none')
          resolved_externally = db_source in ('github', 'secret-manager')
          missing = [
              name for name in required
              if name not in env and not (name == 'DATABASE_URL' and resolved_externally)
          ]
          for name in required:
              item = env.get(name)
              if name == 'DATABASE_URL' and not item and resolved_externally:
                  print(f'DATABASE_URL: will be attached from {db_source}')
              elif not item:
                  print(f'{name}: missing')
              elif item.get('valueFrom'):
                  print(f'{name}: configured from Secret Manager')
              else:
                  print(f'{name}: configured as a service environment value')
          if missing:
              raise SystemExit('Missing required APEX runtime configuration: ' + ', '.join(missing))
          PY

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push immutable image from verified CI SHA
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="us-central1-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/${{ secrets.APEX_CLOUD_RUN_SERVICE }}:$DEPLOY_SHA"
          docker build \
            --platform linux/amd64 \
            --build-arg APEX_BUILD_SHA="$DEPLOY_SHA" \
            --build-arg APEX_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Re-verify current main before production mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$DEPLOY_SHA" != "$current_main" ]]; then
            echo "Deployment candidate became stale before Cloud Run update: candidate=$DEPLOY_SHA current-main=$current_main" >&2
            exit 7
          fi

      - name: Update existing Cloud Run service image
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SOURCE: ${{ steps.db.outputs.source }}
          DB_SECRET_NAME: ${{ steps.db.outputs.secret_name }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --project "$GCP_PROJECT_ID"
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}"
            --image "$IMAGE"
          )
          case "${DB_SOURCE:-none}" in
            secret-manager)
              args+=(--update-secrets "DATABASE_URL=${DB_SECRET_NAME}:latest")
              echo "Attaching DATABASE_URL from Secret Manager secret '$DB_SECRET_NAME'."
              ;;
            github)
              args+=(--update-env-vars "^__APEX_DB__^DATABASE_URL=$DATABASE_URL")
              echo 'Attaching DATABASE_URL from masked GitHub production secret.'
              ;;
            *)
              echo 'No DATABASE_URL to attach; leaving existing service configuration untouched.'
              ;;
          esac
          gcloud run services update "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" "${args[@]}" --quiet

      - name: Verify deployment and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          SERVICE_URL=$(gcloud run services describe "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
            --project "$GCP_PROJECT_ID" \
            --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
            --format='value(status.url)')
          echo "Service URL: ${SERVICE_URL:-<none>}"

          if [[ -z "$SERVICE_URL" ]]; then
            echo 'Cloud Run reports no service URL, so the new revision never became Ready.' >&2
            echo 'Recent revision failures:' >&2
            gcloud run revisions list \
              --project "$GCP_PROJECT_ID" \
              --region "${{ secrets.APEX_CLOUD_RUN_REGION }}" \
              --service "${{ secrets.APEX_CLOUD_RUN_SERVICE }}" \
              --format='table(metadata.name, status.conditions[0].message)' \
              --limit 5 >&2 || true
            exit 6
          fi

          curl -fsS "$SERVICE_URL/" -o /tmp/apex-root.html
          if grep -qi 'Bearer token required' /tmp/apex-root.html; then
            echo 'Dashboard is still blocked by Google IAM.' >&2
            exit 1
          fi

          curl -fsS "$SERVICE_URL/health" -o /tmp/apex-health.json
          python3 - <<'PY'
          import json, os, sys
          d=json.load(open('/tmp/apex-health.json'))
          sha=d.get('build',{}).get('sha')
          print(f"Health: {d.get('status','?')}  SHA: {sha or '?'}  Agents: {d.get('agents','?')}")
          expected=os.environ.get('DEPLOY_SHA')
          if sha != expected:
              print(f"Expected deployed SHA {expected}, got {sha}", file=sys.stderr)
              raise SystemExit(1)
          PY

          API_STATUS=$(curl -sS -o /tmp/apex-api.json -w '%{http_code}' "$SERVICE_URL/api/tasks")
          if [ "$API_STATUS" != "401" ]; then
            echo "Expected anonymous /api/tasks to return 401, got $API_STATUS" >&2
            cat /tmp/apex-api.json >&2 || true
            exit 1
          fi

          curl -fsS "https://apex.donmatthews.live/" -o /tmp/apex-custom-root.html
          if grep -qi 'Bearer token required' /tmp/apex-custom-root.html; then
            echo 'Custom domain is still blocked by Google IAM.' >&2
            exit 1
          fi
