name: Remove superseded PLAN once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-plan-once.yml']

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded plan and reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          text = p.read_text()
          line = '- `PLAN.md` — historical build plan; not current infrastructure authority.\n'
          if line not in text:
              raise SystemExit('Expected PLAN.md AGENTS reference not found')
          p.write_text(text.replace(line, '', 1))
          PY
          rm -f PLAN.md
          rm -f .github/workflows/remove-plan-once.yml
      - name: Verify
        shell: bash
        run: |
          test ! -e PLAN.md
          ! grep -R -n --exclude-dir=.git 'PLAN.md' .
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove superseded historical build plan'
          git push origin HEAD:main
