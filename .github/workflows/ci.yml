name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck production runtime
        run: pnpm run typecheck:production

      - name: Run deterministic agent guards
        run: |
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-routing.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-backpressure.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-budget-pause.ts"
          pnpm --filter @workspace/cicd-automation exec tsx "$GITHUB_WORKSPACE/scripts/verify-deploy-provenance.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-malformed-tool-calls.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-non-completion.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-branch-review-guards.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-opportunity-engine.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-durable-autonomy.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-approval-state-integrity.ts"

      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build

  convex-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck unfinished Convex migration
        continue-on-error: true
        run: pnpm --filter @workspace/convex-backend --filter @workspace/apex-cicd-worker --if-present run typecheck
