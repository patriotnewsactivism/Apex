name: GCP Config Discovery Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gcp-config-discovery-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      V_GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      V_GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      V_GCLOUD_PROJECT: ${{ vars.GCLOUD_PROJECT }}
      V_GCP_REGION: ${{ vars.GCP_REGION }}
      V_GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
      V_CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      V_CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      V_GCP_SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME }}
      V_GOOGLE_CLOUD_RUN_SERVICE: ${{ vars.GOOGLE_CLOUD_RUN_SERVICE }}
      V_ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO }}
      V_GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      V_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      V_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      V_GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      V_GOOGLE_SERVICE_ACCOUNT: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      S_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      S_GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      S_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      S_GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      S_GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      S_GOOGLE_CLOUD_SA_KEY: ${{ secrets.GOOGLE_CLOUD_SA_KEY }}
      S_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      S_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
      S_GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      S_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - name: Report non-secret Cloud Run identifiers and auth presence
        shell: bash
        run: |
          set -euo pipefail
          echo '--- non-secret deployment variables ---'
          for key in \
            GCP_PROJECT_ID GOOGLE_CLOUD_PROJECT GCLOUD_PROJECT \
            GCP_REGION GOOGLE_CLOUD_REGION CLOUD_RUN_REGION \
            CLOUD_RUN_SERVICE GCP_SERVICE_NAME GOOGLE_CLOUD_RUN_SERVICE \
            ARTIFACT_REGISTRY_REPO GAR_REPOSITORY \
            GCP_WORKLOAD_IDENTITY_PROVIDER WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT GOOGLE_SERVICE_ACCOUNT; do
            var="V_${key}"
            value="${!var:-}"
            if [ -n "$value" ]; then printf '%s=%s\n' "$key" "$value"; else printf '%s=<unset>\n' "$key"; fi
          done
          echo '--- secret presence only; values never printed ---'
          for key in \
            GCP_SA_KEY GCP_CREDENTIALS GOOGLE_CREDENTIALS GOOGLE_APPLICATION_CREDENTIALS_JSON \
            GCP_SERVICE_ACCOUNT_KEY GOOGLE_CLOUD_SA_KEY \
            GCP_WORKLOAD_IDENTITY_PROVIDER WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT GOOGLE_SERVICE_ACCOUNT; do
            var="S_${key}"
            value="${!var:-}"
            if [ -n "$value" ]; then printf '%s=present\n' "$key"; else printf '%s=absent\n' "$key"; fi
          done
