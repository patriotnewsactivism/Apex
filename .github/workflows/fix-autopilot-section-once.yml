name: Apply Autopilot Cloud Run section once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-autopilot-section-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/fix-autopilot-cloud-run-section.mjs
      - run: |
          rm scripts/fix-autopilot-cloud-run-section.mjs
          rm .github/workflows/fix-autopilot-section-once.yml
          grep -n 'existing Google Cloud Run service' .agents/skills/apex-autopilot/SKILL.md
          ! grep -n 'AWS Lightsail/CodeBuild path' .agents/skills/apex-autopilot/SKILL.md
      - run: |
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'docs: align Autopilot deployment contract with Cloud Run'
          git push origin HEAD:main
