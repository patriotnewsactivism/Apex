# Audited AWS Lightsail release. Normally manual; a specially-marked main merge
# may trigger one authorized production redeploy when workflow_dispatch is not
# available to the connected GitHub client. The push trigger is intended to be
# removed immediately after the authorized release.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY for production
        type: string
        required: true
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write  # required for OIDC -> AWS role assumption (no static keys)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Pushes do not deploy normally. Only the explicitly marked one-time merge
    # is accepted; ordinary main commits produce a skipped job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[deploy-apex-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
        run: |
          missing=()
          test -n "$AWS_DEPLOY_ROLE_ARN" || missing+=(AWS_DEPLOY_ROLE_ARN)
          test -n "$APEX_DEPLOY_ENABLED" || missing+=(APEX_DEPLOY_ENABLED)
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub production configuration: %s\n' "${missing[*]}" >&2
            exit 2
          fi
          enabled=",${APEX_DEPLOY_ENABLED,,},"
          enabled="${enabled//[[:space:]]/}"
          case "$enabled" in
            ,1,|,true,|,all,|*,production,*) ;;
            *)
              printf 'APEX_DEPLOY_ENABLED does not authorize production: %s\n' "$APEX_DEPLOY_ENABLED" >&2
              exit 2
              ;;
          esac

      - name: Configure AWS credentials via OIDC (no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guard production release
        env:
          DEPLOY_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || 'DEPLOY' }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          test "$DEPLOY_REF" = "refs/heads/main"
          test "$DEPLOY_CONFIRM" = "DEPLOY"

      - name: Build, deploy, and verify Lightsail
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
          APEX_CODEBUILD_PROJECT: ${{ vars.APEX_CODEBUILD_PROJECT || 'apex-lightsail-build' }}
          APEX_LIGHTSAIL_SERVICE: ${{ vars.APEX_LIGHTSAIL_SERVICE || 'apex-service' }}
        run: >-
          pnpm --filter @workspace/cicd-automation exec tsx
          "$GITHUB_WORKSPACE/packages/cicd-automation/scripts/deploy.mts"
          production --expect-sha "${{ github.sha }}"
