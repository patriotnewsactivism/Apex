# Manual, audited AWS Lightsail release. Pushing main does not deploy by itself.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY for production
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
        run: |
          missing=()
          test -n "$AWS_ACCESS_KEY_ID" || missing+=(AWS_ACCESS_KEY_ID)
          test -n "$AWS_SECRET_ACCESS_KEY" || missing+=(AWS_SECRET_ACCESS_KEY)
          test -n "$APEX_DEPLOY_ENABLED" || missing+=(APEX_DEPLOY_ENABLED)
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub production configuration: %s\n' "${missing[*]}" >&2
            exit 2
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Guard production release
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          test "$DEPLOY_REF" = "refs/heads/main"
          test "$DEPLOY_CONFIRM" = "DEPLOY"

      - name: Build, deploy, and verify Lightsail
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          APEX_DEPLOY_ENABLED: ${{ vars.APEX_DEPLOY_ENABLED }}
          APEX_CODEBUILD_PROJECT: ${{ vars.APEX_CODEBUILD_PROJECT || 'apex-lightsail-build' }}
          APEX_LIGHTSAIL_SERVICE: ${{ vars.APEX_LIGHTSAIL_SERVICE || 'apex-service' }}
        run: >-
          pnpm --filter @workspace/core exec tsx
          "$GITHUB_WORKSPACE/packages/cicd-automation/scripts/deploy.mts"
          production --expect-sha "${{ github.sha }}"
