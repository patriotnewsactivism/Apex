<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX — Convex Live Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #07080d;
    color: #e6edf3;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    min-height: 100vh;
  }
  .header {
    background: rgba(13,17,23,0.95);
    border-bottom: 1px solid rgba(0,229,255,0.12);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    background: linear-gradient(135deg, #00e5ff, #b84cff);
    border-radius: 8px;
    padding: 6px 10px;
    font-weight: 800;
    font-size: 14px;
    color: #000;
    letter-spacing: 0.05em;
  }
  .header h1 { font-size: 16px; font-weight: 700; color: #00e5ff; }
  .header .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px rgba(0,255,136,0.5);
    animation: pulse 2s infinite;
  }
  .dot.offline { background: #ff3b5c; box-shadow: 0 0 8px rgba(255,59,92,0.5); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .container {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: rgba(0,229,255,0.08);
    min-height: calc(100vh - 50px);
  }
  @media (max-width: 1024px) {
    .container { grid-template-columns: 1fr; }
  }
  .panel {
    background: #0d1117;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(0,229,255,0.08);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8b949e;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-count {
    background: rgba(0,229,255,0.1);
    color: #00e5ff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
  }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 2px; }

  /* Agent rows */
  .agent-row {
    padding: 8px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .agent-row:hover { background: rgba(0,229,255,0.03); }
  .agent-icon {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .icon-ceo { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; }
  .icon-cto, .icon-coo { background: linear-gradient(135deg, #00e5ff, #0099ff); color: #000; }
  .icon-lead { background: linear-gradient(135deg, #b84cff, #6c5ce7); color: #fff; }
  .icon-dev { background: rgba(0,229,255,0.15); color: #00e5ff; border: 1px solid rgba(0,229,255,0.3); }
  .icon-other { background: rgba(255,255,255,0.08); color: #8b949e; }
  .agent-info { flex: 1; min-width: 0; }
  .agent-name { font-weight: 600; color: #e6edf3; font-size: 12px; }
  .agent-role { font-size: 10px; color: #8b949e; margin-top: 1px; }
  .agent-status {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .st-idle { background: rgba(139,148,158,0.15); color: #8b949e; }
  .st-thinking { background: rgba(0,229,255,0.15); color: #00e5ff; }
  .st-acting { background: rgba(184,76,255,0.15); color: #b84cff; }
  .st-blocked { background: rgba(255,165,0,0.15); color: #ffa500; }
  .st-done { background: rgba(0,255,136,0.15); color: #00ff88; }
  .st-error { background: rgba(255,59,92,0.15); color: #ff3b5c; }

  /* Task rows */
  .task-row {
    padding: 8px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .task-row:hover { background: rgba(0,229,255,0.03); }
  .task-title { font-size: 12px; color: #e6edf3; word-break: break-word; }
  .task-meta { font-size: 10px; color: #8b949e; margin-top: 3px; display: flex; gap: 8px; }
  .task-status {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600;
    text-transform: uppercase; display: inline-block;
  }
  .ts-pending { background: rgba(139,148,158,0.15); color: #8b949e; }
  .ts-in_progress { background: rgba(0,229,255,0.15); color: #00e5ff; }
  .ts-done { background: rgba(0,255,136,0.15); color: #00ff88; }
  .ts-failed { background: rgba(255,59,92,0.15); color: #ff3b5c; }
  .ts-awaiting_approval { background: rgba(255,165,0,0.15); color: #ffa500; }
  .ts-blocked { background: rgba(255,165,0,0.15); color: #ffa500; }
  .ts-cancelled { background: rgba(139,148,158,0.1); color: #6e7681; }

  /* Log rows */
  .log-row {
    padding: 6px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.02);
    font-size: 11px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .log-row:hover { background: rgba(255,255,255,0.02); }
  .log-time { color: #6e7681; font-size: 10px; flex-shrink: 0; min-width: 55px; }
  .log-level {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    flex-shrink: 0; min-width: 55px;
  }
  .ll-info { color: #00e5ff; }
  .ll-thinking { color: #b84cff; }
  .ll-acting { color: #ffa500; }
  .ll-warn { color: #ffd700; }
  .ll-error { color: #ff3b5c; }
  .ll-debug { color: #6e7681; }
  .ll-agent { color: #00ff88; font-size: 10px; flex-shrink: 0; }
  .log-msg { color: #e6edf3; word-break: break-word; flex: 1; }

  .empty { padding: 40px 16px; text-align: center; color: #6e7681; font-size: 12px; }
  .loading { padding: 40px 16px; text-align: center; color: #00e5ff; font-size: 12px; }
  .error-banner {
    background: rgba(255,59,92,0.1);
    border: 1px solid rgba(255,59,92,0.3);
    color: #ff3b5c;
    padding: 8px 16px;
    font-size: 11px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">APEX</div>
  <h1>Convex Live Dashboard</h1>
  <div class="status">
    <div class="dot" id="conn-dot"></div>
    <span id="conn-text">connecting...</span>
    <span style="color:#6e7681;margin-left:8px" id="last-refresh"></span>
  </div>
</div>

<div class="error-banner" id="error-banner" style="display:none"></div>

<div class="container">
  <!-- Agents Panel -->
  <div class="panel">
    <div class="panel-header">
      <span>🤖 Agent Network</span>
      <span class="panel-count" id="agent-count">0</span>
    </div>
    <div class="panel-body" id="agents-body">
      <div class="loading">Loading agents...</div>
    </div>
  </div>

  <!-- Tasks Panel -->
  <div class="panel">
    <div class="panel-header">
      <span>📋 Tasks</span>
      <span class="panel-count" id="task-count">0</span>
    </div>
    <div class="panel-body" id="tasks-body">
      <div class="loading">Loading tasks...</div>
    </div>
  </div>

  <!-- Logs Panel -->
  <div class="panel">
    <div class="panel-header">
      <span>🖥 Live Log Stream</span>
      <span class="panel-count" id="log-count">0</span>
    </div>
    <div class="panel-body" id="logs-body">
      <div class="loading">Loading logs...</div>
    </div>
  </div>
</div>

<script type="module">
  import { ConvexHttpClient } from "https://esm.sh/convex@1.42.3/browser";
  import { anyApi } from "https://esm.sh/convex@1.42.3/server";

  const CONVEX_URL = "https://agile-tern-916.convex.cloud";
  const client = new ConvexHttpClient(CONVEX_URL);
  const api = anyApi;

  const el = (id) => document.getElementById(id);
  const connDot = el('conn-dot');
  const connText = el('conn-text');
  const lastRefresh = el('last-refresh');
  const errorBanner = el('error-banner');

  function setConnected(ok) {
    connDot.className = 'dot' + (ok ? '' : ' offline');
    connText.textContent = ok ? 'LIVE' : 'OFFLINE';
  }

  function showError(msg) {
    errorBanner.style.display = 'block';
    errorBanner.textContent = '⚠ ' + msg;
  }
  function hideError() {
    errorBanner.style.display = 'none';
  }

  function fmtTime(ts) {
    if (!ts) return '--';
    const d = new Date(ts);
    return d.toLocaleTimeString('en-US', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3,'0').slice(0,2);
  }

  function timeAgo(ts) {
    if (!ts) return 'never';
    const sec = Math.floor((Date.now() - ts) / 1000);
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.floor(sec/60) + 'm ago';
    return Math.floor(sec/3600) + 'h ago';
  }

  function agentIconClass(role) {
    const r = role.toLowerCase();
    if (r.includes('ceo')) return 'icon-ceo';
    if (r.includes('cto') || r.includes('coo')) return 'icon-cto';
    if (r.includes('lead')) return 'icon-lead';
    if (r.includes('frontend') || r.includes('backend') || r.includes('devops') || r.includes('qa')) return 'icon-dev';
    return 'icon-other';
  }

  function agentInitials(name) {
    const words = name.split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return name.slice(0,2).toUpperCase();
  }

  function statusClass(status) {
    return 'st-' + status;
  }

  function taskStatusClass(status) {
    return 'ts-' + status;
  }

  function logLevelClass(level) {
    return 'll-' + level;
  }

  function agentLabel(agent) {
    const lid = agent.legacyId || '';
    if (lid.includes('ceo')) return 'CEO';
    if (lid.includes('cto')) return 'CTO';
    if (lid.includes('coo')) return 'COO';
    if (lid.includes('lead-dev')) return 'LEAD-DEV';
    if (lid.includes('frontend')) return 'FRONTEND';
    if (lid.includes('backend')) return 'BACKEND';
    if (lid.includes('devops')) return 'DEVOPS';
    if (lid.includes('qa-director')) return 'QA-DIR';
    if (lid.includes('qa')) return 'QA';
    if (lid.includes('lead-research')) return 'RESEARCH';
    if (lid.includes('sales')) return 'SALES';
    if (lid.includes('marketing')) return 'MKTG';
    if (lid.includes('success')) return 'SUCCESS';
    if (lid === 'smoke-test-agent') return 'TEST';
    return agent.role?.slice(0,6).toUpperCase() || 'AGENT';
  }

  // ─── Render functions ──────────────────────────────────────────────

  function renderAgents(agents) {
    el('agent-count').textContent = agents.length;
    const body = el('agents-body');

    if (agents.length === 0) {
      body.innerHTML = '<div class="empty">No agents found</div>';
      return;
    }

    // Sort: non-idle first, then by tier
    agents.sort((a, b) => {
      const aActive = a.status !== 'idle' ? 0 : 1;
      const bActive = b.status !== 'idle' ? 0 : 1;
      if (aActive !== bActive) return aActive - bActive;
      return (a.tier ?? 9) - (b.tier ?? 9);
    });

    body.innerHTML = agents.map(a => `
      <div class="agent-row">
        <div class="agent-icon ${agentIconClass(a.role)}">${agentInitials(a.name)}</div>
        <div class="agent-info">
          <div class="agent-name">${a.name}</div>
          <div class="agent-role">${agentLabel(a)} · ${a.provider}/${a.model} · ${timeAgo(a.lastActiveAt)}</div>
        </div>
        <div class="agent-status ${statusClass(a.status)}">${a.status}</div>
      </div>
    `).join('');
  }

  function renderTasks(tasks) {
    el('task-count').textContent = tasks.length;
    const body = el('tasks-body');

    if (tasks.length === 0) {
      body.innerHTML = '<div class="empty">No tasks</div>';
      return;
    }

    // Sort by creation time desc (most recent first)
    tasks.sort((a, b) => b._creationTime - a._creationTime);

    body.innerHTML = tasks.slice(0, 100).map(t => `
      <div class="task-row">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          <span class="task-status ${taskStatusClass(t.status)}">${t.status}</span>
          <span>P${t.priority}</span>
          <span>${timeAgo(t._creationTime)}</span>
          ${t.retryCount > 0 ? `<span style="color:#ffa500">retry:${t.retryCount}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  function renderLogs(logs) {
    el('log-count').textContent = logs.length;
    const body = el('logs-body');

    if (logs.length === 0) {
      body.innerHTML = '<div class="empty">No logs</div>';
      return;
    }

    body.innerHTML = logs.map(l => {
      const agentPart = l.agentId ? '' : '';
      return `
      <div class="log-row">
        <span class="log-time">${fmtTime(l.timestamp)}</span>
        <span class="log-level ${logLevelClass(l.level)}">${l.level}</span>
        <span class="log-msg">${escapeHtml(l.message)}</span>
      </div>
    `}).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─── Poll loop ──────────────────────────────────────────────────────

  let pollCount = 0;

  async function poll() {
    try {
      const [agents, tasks, logs] = await Promise.all([
        client.query(api.agents.list, {}),
        client.query(api.tasks.list, {}),
        client.query(api.logs.recent, { limit: 100 }),
      ]);

      setConnected(true);
      hideError();
      renderAgents(agents);
      renderTasks(tasks);
      renderLogs(logs);

      pollCount++;
      lastRefresh.textContent = `· refreshed ${pollCount}×`;
    } catch (err) {
      setConnected(false);
      const msg = err instanceof Error ? err.message : String(err);
      showError(`Convex query failed: ${msg}`);
    }
  }

  // Initial poll
  poll();

  // Poll every 2 seconds
  setInterval(poll, 2000);
</script>

</body>
</html>
