name: One-shot LLM continuity hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/llm-continuity-hotfix.yml
      - scripts/llm-reliability-hotfix.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patcher syntax
        run: node --check scripts/llm-reliability-hotfix.mjs

      - name: Apply fail-closed continuity patch
        run: node scripts/llm-reliability-hotfix.mjs

      - name: Verify critical invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "APEX_LLM_REQUEST_TIMEOUT_MS ?? 30_000" packages/core/src/llm-client.ts
          grep -q "openrouter-gpt-oss-120b-paid" packages/core/src/llm-client.ts
          grep -q "openai/gpt-oss-120b" packages/core/src/model-routing.ts
          ! grep -A8 "const PROVIDER_ORDER" packages/core/src/llm-client.ts | grep -q "minimax\|nemotron"
          ! grep -A16 "const PROVIDERS" packages/convex-backend/convex/llm.ts | grep -q ":free"

      - name: Remove one-shot machinery
        run: rm .github/workflows/llm-continuity-hotfix.yml scripts/llm-reliability-hotfix.mjs

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/llm-client.ts packages/core/src/model-routing.ts packages/convex-backend/convex/llm.ts .github/workflows/llm-continuity-hotfix.yml scripts/llm-reliability-hotfix.mjs
          git diff --cached --check
          git commit -m "fix(llm): fail fast and remove queued free fallbacks"
          git push origin HEAD:main
