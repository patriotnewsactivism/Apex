name: Apply provider backpressure integration v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/provider-backpressure-on-quota-pacing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic source integration
        run: python scripts/apply-provider-backpressure-integration.py

      - name: Verify patch shape
        run: |
          git diff --check
          git status --short

      - name: Commit integrated patch to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate provider backpressure with quota pacing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
