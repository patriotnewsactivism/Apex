name: Deploy APEX to Cloud Run once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-cloud-run-once.yml']

permissions:
  contents: write
  id-token: write

env:
  APEX_DEPLOY_ENABLED: production
  APEX_DEPLOY_HEALTH_URL: https://apex.donmatthews.live
  APEX_GCP_PROJECT_ID: ${{ vars.APEX_GCP_PROJECT_ID || secrets.APEX_GCP_PROJECT_ID || vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || vars.GOOGLE_CLOUD_PROJECT || secrets.GOOGLE_CLOUD_PROJECT }}
  APEX_CLOUD_RUN_REGION: ${{ vars.APEX_CLOUD_RUN_REGION || secrets.APEX_CLOUD_RUN_REGION || vars.CLOUD_RUN_REGION || secrets.CLOUD_RUN_REGION || vars.GCP_REGION || secrets.GCP_REGION }}
  APEX_CLOUD_RUN_SERVICE: ${{ vars.APEX_CLOUD_RUN_SERVICE || secrets.APEX_CLOUD_RUN_SERVICE || vars.CLOUD_RUN_SERVICE || secrets.CLOUD_RUN_SERVICE || vars.SERVICE_NAME || secrets.SERVICE_NAME }}
  WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER || secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER || vars.WORKLOAD_IDENTITY_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER || vars.WIF_PROVIDER || secrets.WIF_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT || vars.GOOGLE_SERVICE_ACCOUNT || secrets.GOOGLE_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT || secrets.WIF_SERVICE_ACCOUNT }}
  GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud with Workload Identity
        if: env.WIF_PROVIDER != '' && env.GCP_DEPLOY_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with existing JSON credential
        if: env.WIF_PROVIDER == '' && env.GCP_CREDENTIALS_JSON != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve and verify the existing APEX Cloud Run target
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          if [[ -z "$ACTIVE_ACCOUNT" ]]; then
            echo "No Google Cloud identity is available in the GitHub production environment." >&2
            echo "WIF provider configured: $([[ -n "$WIF_PROVIDER" ]] && echo yes || echo no)" >&2
            echo "WIF service account configured: $([[ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" ]] && echo yes || echo no)" >&2
            echo "JSON credential configured: $([[ -n "$GCP_CREDENTIALS_JSON" ]] && echo yes || echo no)" >&2
            exit 2
          fi
          echo "Google Cloud authentication is active."

          verify_target() {
            gcloud run services describe "$APEX_CLOUD_RUN_SERVICE" \
              --project "$APEX_GCP_PROJECT_ID" \
              --region "$APEX_CLOUD_RUN_REGION" \
              --platform managed --format=json >/tmp/apex-service.json
          }

          if [[ -n "$APEX_GCP_PROJECT_ID" && -n "$APEX_CLOUD_RUN_REGION" && -n "$APEX_CLOUD_RUN_SERVICE" ]]; then
            verify_target
          else
            echo "Exact Cloud Run identifiers are not fully configured; discovering the existing APEX service from accessible projects using its public /health signature."
            : >/tmp/apex-candidates
            if [[ -n "$APEX_GCP_PROJECT_ID" ]]; then
              printf '%s\n' "$APEX_GCP_PROJECT_ID" >/tmp/apex-projects
            else
              gcloud projects list --filter='lifecycleState:ACTIVE' --format='value(projectId)' >/tmp/apex-projects
            fi

            while IFS= read -r project; do
              [[ -n "$project" ]] || continue
              services="$(gcloud run services list --project "$project" --platform managed --format=json --quiet 2>/dev/null || true)"
              [[ -n "$services" && "$services" != '[]' ]] || continue
              while IFS=$'\t' read -r service region url; do
                [[ -n "$service" && -n "$region" && -n "$url" ]] || continue
                body="$(curl -fsS --max-time 8 "${url%/}/health" 2>/dev/null || true)"
                if [[ -n "$body" ]] && jq -e 'type=="object" and has("build") and has("taskQueue")' >/dev/null 2>&1 <<<"$body"; then
                  printf '%s|%s|%s|%s\n' "$project" "$region" "$service" "$url" >>/tmp/apex-candidates
                fi
              done < <(jq -r '.[] | [(.metadata.name // ""), (.metadata.labels["cloud.googleapis.com/location"] // .metadata.labels.location // ""), (.status.url // .uri // "")] | @tsv' <<<"$services")
            done </tmp/apex-projects

            count="$(grep -c . /tmp/apex-candidates || true)"
            if [[ "$count" != "1" ]]; then
              echo "Could not uniquely identify the existing APEX Cloud Run service; candidate count=$count." >&2
              if [[ "$count" -gt 0 ]]; then
                cut -d'|' -f1-3 /tmp/apex-candidates >&2
              fi
              exit 3
            fi
            IFS='|' read -r APEX_GCP_PROJECT_ID APEX_CLOUD_RUN_REGION APEX_CLOUD_RUN_SERVICE _ </tmp/apex-candidates
            export APEX_GCP_PROJECT_ID APEX_CLOUD_RUN_REGION APEX_CLOUD_RUN_SERVICE
            verify_target
          fi

          echo "Resolved existing target: project=$APEX_GCP_PROJECT_ID region=$APEX_CLOUD_RUN_REGION service=$APEX_CLOUD_RUN_SERVICE"
          echo "APEX_GCP_PROJECT_ID=$APEX_GCP_PROJECT_ID" >> "$GITHUB_ENV"
          echo "APEX_CLOUD_RUN_REGION=$APEX_CLOUD_RUN_REGION" >> "$GITHUB_ENV"
          echo "APEX_CLOUD_RUN_SERVICE=$APEX_CLOUD_RUN_SERVICE" >> "$GITHUB_ENV"

      - name: Remove this one-shot workflow and freeze the release SHA
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deploy-cloud-run-once.yml
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'ops: remove one-shot Cloud Run deployment workflow'
          git push origin HEAD:main
          SHA="$(git rev-parse HEAD)"
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Release SHA: $SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck production runtime
        run: pnpm run typecheck:production

      - name: Run deterministic production guards
        run: |
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-routing.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-backpressure.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-budget-pause.ts"
          pnpm --filter @workspace/cicd-automation exec tsx "$GITHUB_WORKSPACE/scripts/verify-deploy-provenance.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-malformed-tool-calls.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-non-completion.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-branch-review-guards.ts"

      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build

      - name: Deploy exact release SHA to the existing Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -z "$(git status --porcelain)"
          bash scripts/deploy-from-shell.sh

      - name: Verify public production SHA and health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 20 https://apex.donmatthews.live/health)"
          live_sha="$(jq -r '.build.sha // empty' <<<"$body")"
          verdict="$(jq -r '.taskQueue.verdict // empty' <<<"$body")"
          echo "Expected SHA: $DEPLOY_SHA"
          echo "Live SHA: $live_sha"
          echo "Task queue verdict: $verdict"
          [[ -n "$live_sha" && "${live_sha:0:12}" = "${DEPLOY_SHA:0:12}" ]]
          [[ "$verdict" = "healthy" || "$verdict" = "ok" || "$verdict" = "pass" ]]
