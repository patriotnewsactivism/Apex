# PRODUCTION BUILD CONTRACT. This is not a portability draft any more: Railway
# builds APEX from this file, and the service it produces is what serves
# https://apex.donmatthews.live. The Cloud Run cutover completed 2026-09-15 —
# see docs/HOSTING_MIGRATION.md.
#
# Two consequences worth stating where they will be read:
#   - a push to main reaches production through Railway, not a deploy workflow;
#     Wait for CI is a host GitHub-trigger setting (checkSuites), currently on,
#     and gates on Actions production-checks — not the GitHub Vercel status;
#   - changing builder, dockerfilePath or healthcheckPath changes how
#     production is built and gated, so scripts/verify-deploy-provenance.ts
#     asserts all three.
#
# Reuse the existing Dockerfile, /health, PORT contract, durable database, and
# existing secret names. Never copy secrets into source control.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Operator setting on the GitHub integration (not a railway.toml key):
# Wait for CI / checkSuites is enabled so a red production-checks run cannot
# ship. The GitHub Vercel status is the dashboard project and is not this gate.
