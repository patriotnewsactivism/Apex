name: Correct CHECKLIST banner once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/checklist-banner-once.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update banner only
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'CHECKLIST.md';
          const text = fs.readFileSync(path, 'utf8');
          const marker = 'Master tracking checklist for the roadmap in `ROADMAP.md`.';
          const index = text.indexOf(marker);
          if (index < 0) throw new Error('CHECKLIST tracking marker not found');
          const rest = text.slice(index);
          const header = `# Apex Implementation Checklist\n\n> **⚠️ 2026-08-28 — CURRENT INFRASTRUCTURE NOTE (read before acting on anything below).**\n> Deployment/hosting references inside this planning document may be historical.\n> **APEX production runs on the existing Google Cloud Run service behind\n> \`https://apex.donmatthews.live\`.** AWS Lightsail/CodeBuild and Railway are\n> retired APEX hosting paths. Vercel and other platforms may still be client\n> deployment targets, but they are not the APEX control-plane host. Current\n> authority is \`AGENTS.md\`, \`README.md\`, \`docs/ARCHITECTURE_DECISIONS.md\`, and\n> \`docs/PRODUCTION_OPERATIONS.md\`.\n\n`;
          fs.writeFileSync(path, header + rest);
          NODE
          rm .github/workflows/checklist-banner-once.yml
      - name: Validate and commit
        run: |
          grep -n "Google Cloud Run" CHECKLIST.md
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'docs: correct CHECKLIST infrastructure banner'
          git push origin HEAD:main
