name: Fix Autopilot Cloud Run contract once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-autopilot-cloud-run-once.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace retired deployment section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.agents/skills/apex-autopilot/SKILL.md')
          text = p.read_text()
          old = '''## 7. Deployment Contract — APEX Itself

Do not conflate client-project deployment tooling with APEX's own host.

For APEX production, use the currently documented AWS Lightsail/CodeBuild path and re-check `AGENTS.md` before acting because infrastructure can change.

Current expected sequence is conceptually:

1. Ensure the intended commit is on the approved branch.
2. Start the configured CodeBuild project.
3. Wait for build success and image publication.
4. Create a Lightsail container service deployment using the current service spec, changing only intended fields.
5. Poll until the new deployment is `ACTIVE`.
6. Resolve the actual service URL.
7. Call `/health` and confirm the live `build.sha` equals the intended commit.
8. Smoke-test the changed feature through the real live path.

A successful CodeBuild is not a deployment. An `ACTIVE` Lightsail deployment is not enough without live commit/feature verification.

Rollback is also a production mutation and remains gated. When rollback is needed, prepare the previous known-good spec/commit and verification plan before requesting approval.
'''
          new = '''## 7. Deployment Contract — APEX Itself

Do not conflate client-project deployment tooling with APEX's own host.

APEX production runs on the **existing Google Cloud Run service** behind `https://apex.donmatthews.live`. Re-check `AGENTS.md`, `docs/PRODUCTION_OPERATIONS.md`, and direct live evidence before acting because infrastructure can change only through an explicit architecture decision.

Current expected sequence is conceptually:

1. Identify the exact intended reviewed commit and require green CI.
2. Resolve the existing Google Cloud project, region, and Cloud Run service from trusted configuration; never guess or create a substitute service.
3. Confirm the authenticated Google identity can describe that exact existing service.
4. Build the exact clean commit with Google Cloud Build using `cloudbuild.apex.yaml` and an immutable SHA-derived image tag.
5. Update only the existing Cloud Run service image with `gcloud run services update` so existing secrets, environment, service account, scaling, ingress, resources, and domain mapping are preserved.
6. Wait for the new revision to become Ready.
7. Call the public `/health` endpoint and confirm `build.sha` equals the intended commit and the task queue is healthy.
8. Smoke-test the changed feature through the real production path.

A successful Cloud Build is not a deployment. A Ready Cloud Run revision is not enough without public live-commit and feature verification.

Rollback is also a production mutation and remains gated. When rollback is needed, prepare the previous known-good Cloud Run revision and verification plan before requesting approval, then verify public health after traffic is restored.
'''
          if old not in text:
              raise SystemExit('Expected retired deployment section not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-autopilot-cloud-run-once.yml
      - name: Verify no active AWS deploy contract remains
        shell: bash
        run: |
          ! grep -n 'use the currently documented AWS Lightsail/CodeBuild path' .agents/skills/apex-autopilot/SKILL.md
          grep -n 'existing Google Cloud Run service' .agents/skills/apex-autopilot/SKILL.md
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'docs: align Autopilot deployment contract with Cloud Run'
          git push origin HEAD:main
