name: Secure Tavily Secret Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-tavily-secret-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: apex-secure-tavily-secret-bridge
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: apex-503709
  EXPECTED_DEPLOY_SERVICE_ACCOUNT: 429262820734-compute@developer.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/429262820734/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SERVICE: ${{ secrets.APEX_CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ secrets.APEX_CLOUD_RUN_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GCP_SERVICE"
          test -n "$GCP_REGION"
          gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null

      - name: Open encrypted transfer bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/tavily-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/tavily-private.pem -pubout -out /tmp/tavily-public.pem
          public_key_b64="$(base64 -w0 /tmp/tavily-public.pem)"
          title="Tavily secret bridge public key ${GITHUB_RUN_ID}"
          jq -n --arg title "$title" --arg body "$public_key_b64" '{title:$title,body:$body}' >/tmp/public-issue.json
          issue_number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input /tmp/public-issue.json --jq '.number')"
          echo "public_issue=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "Bridge public key published in issue #${issue_number}; waiting for encrypted payload."

      - name: Receive, decrypt, and store Tavily credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ISSUE: ${{ steps.bridge.outputs.public_issue }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload_title="Tavily secret bridge payload ${GITHUB_RUN_ID}"
          payload_number=''
          payload_body=''

          for _ in $(seq 1 120); do
            record="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq ".[] | select(.title == \"${payload_title}\") | [.number,.body] | @tsv" | head -n1 || true)"
            if [[ -n "$record" ]]; then
              payload_number="${record%%$'\t'*}"
              payload_body="${record#*$'\t'}"
              break
            fi
            sleep 5
          done

          if [[ -z "$payload_body" ]]; then
            gh issue close "$PUBLIC_ISSUE" >/dev/null 2>&1 || true
            echo 'Encrypted Tavily payload was not received before the bridge expired.' >&2
            exit 2
          fi

          printf '%s' "$payload_body" | base64 -d >/tmp/tavily-payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/tavily-private.pem \
            -in /tmp/tavily-payload.enc \
            -out /tmp/tavily-payload.json \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          python3 - <<'PY'
          import json, os
          path = '/tmp/tavily-payload.json'
          with open(path, 'r', encoding='utf-8') as f:
              payload = json.load(f)
          for field in ('dev', 'prod'):
              value = payload.get(field, '')
              if not isinstance(value, str) or not value.startswith('tvly-') or len(value) < 20:
                  raise SystemExit(f'invalid {field} Tavily credential payload')
              out = f'/tmp/tavily-{field}.key'
              with open(out, 'w', encoding='utf-8') as f:
                  f.write(value)
              os.chmod(out, 0o600)
          os.remove(path)
          PY

          ensure_secret() {
            local name="$1"
            local file="$2"
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
            fi
            gcloud secrets versions add "$name" --project "$GCP_PROJECT_ID" --data-file="$file" >/dev/null
          }

          ensure_secret apex-tavily-dev-api-key /tmp/tavily-dev.key
          ensure_secret apex-tavily-api-key /tmp/tavily-prod.key

          gcloud run services update "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --update-secrets TAVILY_API_KEY=apex-tavily-api-key:latest \
            --quiet >/dev/null

          python3 - <<'PY'
          import json, urllib.request
          key = open('/tmp/tavily-prod.key', encoding='utf-8').read().strip()
          req = urllib.request.Request(
              'https://api.tavily.com/search',
              data=json.dumps({'query':'Tavily Search API','search_depth':'basic','max_results':1}).encode(),
              headers={'Content-Type':'application/json','Authorization':f'Bearer {key}'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f'Tavily smoke test returned HTTP {response.status}')
          PY

          rm -f /tmp/tavily-private.pem /tmp/tavily-public.pem /tmp/tavily-payload.enc /tmp/tavily-dev.key /tmp/tavily-prod.key
          gh issue close "$payload_number" >/dev/null 2>&1 || true
          gh issue close "$PUBLIC_ISSUE" >/dev/null 2>&1 || true
          echo 'APEX Tavily production secret stored, attached to Cloud Run, and live-search verified.'
