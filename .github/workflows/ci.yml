name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify schema changes include migrations
        run: node scripts/verify-schema-migration-drift.mjs

      - name: Typecheck production runtime
        run: pnpm run typecheck:production

      - name: Run deterministic agent guards
        run: |
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-routing.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-provider-backpressure.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-capacity-pause-floor.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-capacity-observability.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-diagnostics-tmp.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-agent-status-recovery.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-request-budget.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-embedding-diagnostics.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-email-campaigns-surface.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-sales-ops-automation-ordering.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-sales-ops-call-cost-regex.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-sales-ops-sms.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-call-bridge.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-telnyx-front-desk.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-budget-pause.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-chat-capacity-handling.ts"
          pnpm --filter @workspace/cicd-automation exec tsx "$GITHUB_WORKSPACE/scripts/verify-deploy-provenance.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-malformed-tool-calls.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-non-completion.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-branch-review-guards.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-opportunity-engine.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-durable-autonomy.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-approval-state-integrity.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-task-timeout-quarantine.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-durable-worker-runtime.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-model-routing-policy.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-model-intelligence.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-websocket-auth.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-websocket-lifecycle.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-live-voice-reconnect.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-tool-call-log-truncation.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-lead-outreach-angle-required.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-strategy-queue.ts"
          pnpm --filter @workspace/cicd-automation exec tsx "$GITHUB_WORKSPACE/scripts/verify-ci-workspace-guard.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-artifact-store.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-workspace-sync.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-cron-governor.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-approval-policy.ts"
          pnpm --filter @workspace/executor exec tsx "$GITHUB_WORKSPACE/scripts/verify-executor-dispatch.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-checkpoint-resume.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-soft-deadline-yield.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-heavy-work-routing.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-task-repetition-guard.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-durable-worker-heartbeat.ts"
          pnpm --filter @workspace/api-server exec tsx "$GITHUB_WORKSPACE/scripts/verify-autonomy-dashboard.ts"
          pnpm --filter @workspace/core exec tsx "$GITHUB_WORKSPACE/scripts/verify-crash-recovery-integration.ts"

      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build

  # The mobile layout guard. Kept as its own job rather than appended to
  # production-checks so a browser download never slows the fast gate, and so a
  # failure here names itself instead of hiding inside a 24-script guard step.
  #
  # This exists because the guard was written to make "zero horizontal scroll at
  # 360-430px" enforceable, then was never wired up -- it only ever ran when
  # someone invoked it by hand. 6e59118 (#124) changed LeadsPanel.tsx and
  # dashboard/src/lib/api.ts and shipped with no mobile check at all. It happens
  # to be clean (verified: 0/54), but that was luck, not a guarantee.
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The script serves packages/dashboard/dist, so the build must precede it.
      - name: Build dashboard
        run: pnpm --filter @workspace/dashboard run build

      # playwright is already a dependency of @workspace/core; only the browser
      # binary is missing on a clean runner.
      - name: Install Chromium
        run: pnpm --filter @workspace/core exec playwright install --with-deps chromium

      # Fails the job on: any horizontal overflow at 360/390/430px, a view that
      # renders blank (a crashed tree cannot overflow, so blankness would
      # otherwise read as clean), or a nav view the harness does not visit.
      - name: Verify mobile layout
        run: node packages/core/scripts/verify-mobile-overflow.mjs

  # Production is built from this Dockerfile by Railway (railway.toml), and
  # Railway deploys from main with Wait for CI enabled, so this workflow is the
  # production deployment gate. Until this job existed, nothing anywhere built the image, so a Dockerfile
  # that did not build reached production before anyone found out. The base-image
  # swap on 2026-09-15 (node:22-alpine -> node:22-slim, apk -> apt-get) shipped
  # on typecheck and text-matching guards alone.
  #
  # Runs on every PR rather than behind a path filter: native modules break on
  # dependency changes, not just Dockerfile edits, and pnpm-lock.yaml churn is
  # exactly the case worth catching. The GHA layer cache keeps repeat builds
  # cheap; the first one after a base change is the expensive one, by design.
  container-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # target: runtime, not the default final stage by accident -- the runtime
      # stage is where apt-get runs and where `pnpm install --prod` resolves
      # production dependencies. A builder-only build would miss precisely the
      # class of failure this job exists to catch.
      - name: Build the production runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: apex-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is necessary but not sufficient. onnxruntime-node's prebuilt
      # binary is glibc-linked, and on the musl base it built fine and then
      # failed to load at runtime -- degrading to keyword search rather than
      # crashing, which is why it went unnoticed from 2026-08-28 to 2026-09-15.
      # These assertions are about what the image can actually LOAD.
      - name: Smoke-test the runtime image
        run: |
          docker run --rm --entrypoint sh apex-runtime:ci -e -c '
            set -eu

            # 1. The glibc loader musl lacked. This is the exact missing file
            #    from the production error: ld-linux-x86-64.so.2.
            if [ ! -e /lib64/ld-linux-x86-64.so.2 ] \
               && [ ! -e /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 ]; then
              echo "FAIL: no glibc dynamic loader in the runtime image"
              exit 1
            fi

            # 2. onnxruntime ships the .so that could not be loaded. Resolve its
            #    dependencies the way the loader will at runtime.
            so=$(find /app/node_modules/.pnpm -name "libonnxruntime.so*" 2>/dev/null | head -1)
            if [ -z "$so" ]; then
              echo "FAIL: libonnxruntime.so not found; @xenova/transformers should pull it"
              exit 1
            fi
            if ldd "$so" | grep -q "not found"; then
              echo "FAIL: unresolved shared libraries for $so"
              ldd "$so" | grep "not found"
              exit 1
            fi

            # 3. @xenova/transformers requires sharp, sharp ships no binary in
            #    its tarball, and --ignore-scripts skips the install script that
            #    fetches one. Missing, the embedding pipeline throws on import and
            #    semantic memory degrades to keyword search without going red.
            if ! find /app/node_modules/.pnpm -name "sharp-*.node" 2>/dev/null | grep -q .; then
              echo "FAIL: sharp native binary missing; pnpm rebuild -r sharp did not run"
              exit 1
            fi

            # 4. browserCheck probes these two paths and throws when neither
            #    exists. The Alpine package installed /usr/bin/chromium-browser;
            #    Debian installs /usr/bin/chromium.
            if [ ! -x /usr/bin/chromium ] && [ ! -x /usr/bin/chromium-browser ]; then
              echo "FAIL: no system chromium for browserCheck"
              exit 1
            fi

            echo "OK: glibc loader, onnxruntime deps, sharp binary and chromium all present"
          '

  convex-experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck unfinished Convex migration
        continue-on-error: true
        run: pnpm --filter @workspace/convex-backend --filter @workspace/apex-cicd-worker --if-present run typecheck
