name: Prune stale docs and references once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prune-stale-docs-once.yml']

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired migration note and stale references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checklist = Path('CHECKLIST.md')
          text = checklist.read_text()
          old = 'documented as UNVERIFIED in apexplan.md)'
          new = 'historically unverified during the retired Convex migration)'
          if old not in text:
              raise SystemExit('Expected apexplan.md reference not found in CHECKLIST.md')
          checklist.write_text(text.replace(old, new, 1))

          skill = Path('.agents/skills/apex-autopilot/SKILL.md')
          text = skill.read_text()
          text = text.replace('      - "Lightsail"', '      - "Cloud Run"')
          old_sentence = 'Never revive Railway as APEX hosting merely because old docs mention it. Current APEX production is AWS Lightsail unless live evidence shows a newer migration.'
          new_sentence = 'Never revive Railway or AWS Lightsail as APEX hosting merely because old docs or history mention them. Current APEX production is the existing Google Cloud Run service behind `https://apex.donmatthews.live` unless direct live evidence and an explicit architecture change establish a newer migration.'
          if old_sentence not in text:
              raise SystemExit('Expected stale APEX hosting sentence not found in SKILL.md')
          skill.write_text(text.replace(old_sentence, new_sentence, 1))
          PY

          rm -f apexplan.md
          rm -f .github/workflows/prune-stale-docs-once.yml

      - name: Verify stale active references are gone
        shell: bash
        run: |
          ! grep -R -n --exclude-dir=.git --exclude='ARCHITECTURE_DECISIONS.md' 'Current APEX production is AWS Lightsail' .
          ! grep -R -n --exclude-dir=.git 'apexplan.md' .
          grep -n 'Google Cloud Run' .agents/skills/apex-autopilot/SKILL.md

      - name: Commit prune
        shell: bash
        run: |
          git config user.name 'Matthew Reardon'
          git config user.email 'patriotnewsactivism@proton.me'
          git add -A
          git diff --cached --check
          git commit -m 'chore: prune stale repository documentation'
          git push origin HEAD:main
