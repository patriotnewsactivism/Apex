name: Apply BuildMyBot retention supervision

on:
  push:
    branches:
      - feat/buildmybot-retention-supervision

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Apply registration patch
        run: node scripts/apply-buildmybot-retention-supervision.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: pnpm exec prettier --write packages/core/src/buildmybot-retention-tools.ts packages/core/src/tool-registry.ts packages/core/src/index.ts scripts/verify-buildmybot-retention-tools.ts

      - name: Typecheck core
        run: pnpm --filter @workspace/core run typecheck

      - name: Verify retention telemetry aggregation
        run: node packages/core/node_modules/tsx/dist/cli.mjs scripts/verify-buildmybot-retention-tools.ts

      - name: Commit verified patch and remove one-shot machinery
        run: |
          rm scripts/apply-buildmybot-retention-supervision.mjs
          rm .github/workflows/apply-buildmybot-retention-supervision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat(buildmybot): supervise retention and voice outcomes"
          git push origin HEAD:feat/buildmybot-retention-supervision
